name: Update matches

on:
  schedule:
    - cron: "0 6 * * *"  # кожен день 06:00
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Generate matches
      run: |
        curl -s "https://v3.football.api-sports.io/fixtures?date=$(date +%Y-%m-%d)" \
        -H "x-apisports-key: 62b022a67541a98d6a3ed1ac49921ec6" > raw.json

        node parse.js

    - name: Commit
      run: |
        git config user.name github-actions
        git config user.email github-actions@github.com
        git add matches.json
        git commit -m "update matches" || echo "no changes"
        git push