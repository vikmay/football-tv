name: Update matches

on:
    schedule:
        - cron: '5 * * * *'
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: update-matches
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v5

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  check-latest: true

            - name: Generate matches
              run: FORCE_REFRESH=1 node parse.js

            - name: Commit changes
              run: |
                  if git diff --quiet -- matches.json matches.meta.json; then
                    echo "No changes to commit"
                    exit 0
                  fi
                  git config user.name github-actions
                  git config user.email github-actions@github.com
                  git add matches.json matches.meta.json
                  git commit -m "update matches"

                  # Prevent: "remote contains work that you do not have locally"
                  # by rebasing our commit on top of the latest remote branch before pushing.
                  branch="$(git rev-parse --abbrev-ref HEAD)"
                  git fetch origin "$branch"
                  git pull --rebase -X theirs origin "$branch" 2>/dev/null || {
                    # resolve any leftover conflicts (e.g. matches.meta.json) in favour of our commit
                    git diff --name-only --diff-filter=U | xargs -r git checkout --theirs
                    git rebase --continue
                  }

                  git push
