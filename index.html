<!DOCTYPE html>
<html lang="uk">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
              content="width=device-width, initial-scale=1">
        <title>Football TV</title>

        <style>
            body {
                margin: 0;
                background: #0f0f0f;
                color: white;
                font-family: Arial;
            }

            .header {
                text-align: center;
                font-size: 50px;
                padding: 30px;
            }

            .day {
                color: #00ff88;
                font-size: 28px;
                margin: 20px;
                text-align: center;
            }

            .day--today {
                color: #ff3b30;
            }

            .match {
                background: #1e1e1e;
                margin: 10px auto;
                padding: 18px 20px 16px;
                max-width: 900px;
                border-radius: 12px;
                display: flex;
                flex-direction: column;
                gap: 10px;
                font-size: 26px;
            }

            .match__league {
                color: #ffcc00;
                font-size: 16px;
                font-weight: bold;
                text-align: center;
                text-transform: uppercase;
                letter-spacing: 0.08em;
            }

            .match__league-stage {
                color: #7dd3fc;
            }

            .match__body {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 16px;
                width: 100%;
            }

            .match__teams {
                flex: 1;
                text-align: left;
                line-height: 1.25;
            }

            .match__teams-main {
                display: block;
            }

            .league {
                color: #aaa;
                font-size: 18px;
            }

            .time {
                color: #00ff88;
                font-weight: bold;
                white-space: nowrap;
            }

            .score {
                color: #ffcc00;
                font-weight: bold;
            }

            #error {
                text-align: center;
                color: red;
                font-size: 22px;
            }

            .empty {
                margin: 10px;
                color: #777;
            }

            .standings {
                max-width: 900px;
                margin: 40px auto 24px;
                padding: 18px 16px 20px;
                background: #161616;
                border-radius: 12px;
            }

            .standings__desktop {
                display: block;
            }

            .standings__mobile {
                display: none;
            }

            .standings__cards {
                display: grid;
                gap: 12px;
            }

            .standings-card {
                background: linear-gradient(180deg, #1f1f1f 0%, #171717 100%);
                border: 1px solid #2a2a2a;
                border-radius: 16px;
                padding: 13px 14px 14px;
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
                display: grid;
                gap: 10px;
            }

            .standings-card__top {
                display: grid;
                grid-template-columns: 34px minmax(0, 1fr) auto;
                align-items: center;
                gap: 10px;
                min-width: 0;
            }

            .standings-card__rank {
                width: 34px;
                height: 34px;
                border-radius: 10px;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                background: #2c2c2c;
                color: #ffcc00;
                font-weight: 800;
                font-size: 14px;
            }

            .standings-card__team {
                min-width: 0;
                font-size: 18px;
                font-weight: 800;
                color: #fff;
                line-height: 1.15;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .standings-card__points {
                min-width: 44px;
                padding: 7px 10px;
                border-radius: 999px;
                background: rgba(0, 255, 136, 0.12);
                color: #00ff88;
                font-size: 18px;
                font-weight: 900;
                text-align: center;
                line-height: 1;
            }

            .standings-card__subhead {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 10px;
            }

            .standings-card__record {
                color: #d0d0d0;
                font-size: 13px;
                font-weight: 600;
                line-height: 1.35;
            }

            .standings-card__stats {
                display: grid;
                grid-template-columns: repeat(4, minmax(0, 1fr));
                gap: 8px;
            }

            .standings-stat {
                background: #232323;
                border: 1px solid #313131;
                border-radius: 12px;
                padding: 8px 6px;
                text-align: center;
            }

            .standings-stat__label {
                display: block;
                color: #9b9b9b;
                font-size: 11px;
                line-height: 1;
                margin-bottom: 4px;
                text-transform: uppercase;
                letter-spacing: 0.05em;
            }

            .standings-stat__value {
                display: block;
                color: #fff;
                font-size: 16px;
                font-weight: 800;
                line-height: 1.1;
            }

            .standings__title {
                margin: 0 0 14px;
                text-align: center;
                font-size: 28px;
                color: #ffcc00;
            }

            .standings__table {
                width: 100%;
                border-collapse: collapse;
                font-size: 18px;
            }

            .standings__table th,
            .standings__table td {
                padding: 12px 10px;
                border-bottom: 1px solid #2a2a2a;
                text-align: center;
            }

            .standings__table th {
                color: #aaa;
                font-weight: 700;
                font-size: 14px;
                text-transform: uppercase;
                letter-spacing: 0.06em;
            }

            .standings__table td:first-child,
            .standings__table th:first-child {
                text-align: left;
            }

            .standings__team {
                font-weight: 700;
                color: #fff;
            }

            .standings__note {
                margin-top: 10px;
                color: #888;
                font-size: 14px;
                text-align: center;
            }

            @media (max-width: 600px) {
                .header {
                    font-size: 32px;
                    padding: 16px 12px;
                }

                .day {
                    font-size: 20px;
                    margin: 12px 12px;
                }

                .match {
                    font-size: 16px;
                    padding: 14px 12px 12px;
                    margin: 8px 10px;
                    gap: 8px;
                }

                .match__league {
                    font-size: 11px;
                }

                .match__body {
                    gap: 12px;
                }

                .time,
                .score {
                    font-size: 14px;
                }

                #error {
                    font-size: 16px;
                }

                .standings {
                    margin: 28px 10px 18px;
                    padding: 14px 10px 12px;
                }

                .standings__title {
                    font-size: 22px;
                    margin-bottom: 12px;
                }

                .standings__desktop {
                    display: none;
                }

                .standings__mobile {
                    display: block;
                }

                .standings__note {
                    font-size: 12px;
                    line-height: 1.4;
                    margin-top: 12px;
                }
            }

            @media (max-width: 420px) {
                .standings {
                    margin-left: 8px;
                    margin-right: 8px;
                    padding-left: 8px;
                    padding-right: 8px;
                }

                .standings-card {
                    padding: 11px 10px 12px;
                    border-radius: 14px;
                }

                .standings-card__team {
                    font-size: 16px;
                }

                .standings-card__points {
                    min-width: 40px;
                    font-size: 16px;
                    padding: 6px 8px;
                }

                .standings-card__stats {
                    gap: 6px;
                }

                .standings-stat {
                    padding: 7px 4px;
                }

                .standings-stat__value {
                    font-size: 15px;
                }
            }

            @media (max-width: 900px) and (orientation: portrait) {
                .header {
                    font-size: 38px;
                    padding: 18px 14px;
                }

                .day {
                    font-size: 24px;
                    margin: 14px 12px;
                }

                .match {
                    font-size: 18px;
                    padding: 16px 14px 14px;
                    margin: 10px 12px;
                    gap: 9px;
                }

                .match__league {
                    font-size: 12px;
                }

                .match__body {
                    gap: 14px;
                }

                .time,
                .score {
                    font-size: 16px;
                }

                #error {
                    font-size: 16px;
                }
            }
        </style>
    </head>

    <body>

        <div class="header">⚽ Football TV</div>
        <div id="content">Loading...</div>
        <div id="standings"></div>

        <script>
            let hasScrolledToToday = false;

            function renderLeagueLabel(label) {
                return String(label || "").replace(/\s*\(([^)]+)\)/, ' <span class="match__league-stage">($1)</span>');
            }

            function getKyivTodayIso() {
                return new Intl.DateTimeFormat("en-CA", {
                    timeZone: "Europe/Kyiv",
                    year: "numeric",
                    month: "2-digit",
                    day: "2-digit"
                }).format(new Date());
            }

            function formatDateUk(dateIso) {
                const date = new Date(`${dateIso}T12:00:00Z`);
                const todayIso = getKyivTodayIso();
                const weekdays = [
                    "неділя",
                    "понеділок",
                    "вівторок",
                    "середа",
                    "четвер",
                    "пʼятниця",
                    "субота"
                ];
                const dayName = weekdays[date.getUTCDay()];
                const formattedDate = date.toLocaleDateString("uk-UA", {
                    timeZone: "Europe/Kyiv",
                    day: "numeric",
                    month: "long"
                });

                return dateIso === todayIso
                    ? `Сьогодні, ${formattedDate}`
                    : `${dayName}, ${formattedDate}`;
            }

            function parseScore(score) {
                const match = String(score || "").match(/^(\d+)\s*-\s*(\d+)$/);
                if (!match) {
                    return null;
                }

                return {
                    home: Number(match[1]),
                    away: Number(match[2])
                };
            }

            function buildUplStandings(matches) {
                const table = new Map();

                for (const match of matches) {
                    const score = parseScore(match.score);
                    if (!score) {
                        continue;
                    }

                    if (!table.has(match.home)) {
                        table.set(match.home, { team: match.home, played: 0, wins: 0, draws: 0, losses: 0, goalsFor: 0, goalsAgainst: 0, points: 0 });
                    }

                    if (!table.has(match.away)) {
                        table.set(match.away, { team: match.away, played: 0, wins: 0, draws: 0, losses: 0, goalsFor: 0, goalsAgainst: 0, points: 0 });
                    }

                    const home = table.get(match.home);
                    const away = table.get(match.away);

                    home.played += 1;
                    away.played += 1;
                    home.goalsFor += score.home;
                    home.goalsAgainst += score.away;
                    away.goalsFor += score.away;
                    away.goalsAgainst += score.home;

                    if (score.home > score.away) {
                        home.wins += 1;
                        home.points += 3;
                        away.losses += 1;
                    } else if (score.home < score.away) {
                        away.wins += 1;
                        away.points += 3;
                        home.losses += 1;
                    } else {
                        home.draws += 1;
                        away.draws += 1;
                        home.points += 1;
                        away.points += 1;
                    }
                }

                return Array.from(table.values())
                    .map(item => ({
                        ...item,
                        goalDifference: item.goalsFor - item.goalsAgainst
                    }))
                    .sort((a, b) =>
                        b.points - a.points ||
                        b.goalDifference - a.goalDifference ||
                        b.goalsFor - a.goalsFor ||
                        a.team.localeCompare(b.team, "uk")
                    );
            }

            function renderUplStandings(matches) {
                const standingsHost = document.getElementById("standings");
                const standings = buildUplStandings(matches);

                if (!standings.length) {
                    standingsHost.innerHTML = "";
                    return;
                }

                standingsHost.innerHTML = `
                    <section class="standings">
                        <h2 class="standings__title">Таблиця УПЛ</h2>

                        <div class="standings__desktop">
                            <table class="standings__table">
                                <thead>
                                    <tr>
                                        <th>#</th>
                                        <th>Команда</th>
                                        <th>І</th>
                                        <th>В</th>
                                        <th>Н</th>
                                        <th>П</th>
                                        <th>М</th>
                                        <th>Р</th>
                                        <th>О</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${standings.map((team, index) => `
                                        <tr>
                                            <td>${index + 1}</td>
                                            <td class="standings__team">${team.team}</td>
                                            <td>${team.played}</td>
                                            <td>${team.wins}</td>
                                            <td>${team.draws}</td>
                                            <td>${team.losses}</td>
                                            <td>${team.goalsFor}:${team.goalsAgainst}</td>
                                            <td>${team.goalDifference > 0 ? `+${team.goalDifference}` : team.goalDifference}</td>
                                            <td>${team.points}</td>
                                        </tr>
                                    `).join("")}
                                </tbody>
                            </table>
                        </div>

                        <div class="standings__mobile">
                            <div class="standings__cards">
                                ${standings.map((team, index) => `
                                    <article class="standings-card">
                                        <div class="standings-card__top">
                                            <div class="standings-card__rank">${index + 1}</div>
                                            <div class="standings-card__team">${team.team}</div>
                                            <div class="standings-card__points">${team.points}</div>
                                        </div>

                                        <div class="standings-card__subhead">
                                            <div class="standings-card__record">${team.played} матчів · ${team.wins}В ${team.draws}Н ${team.losses}П</div>
                                        </div>

                                        <div class="standings-card__stats">
                                            <div class="standings-stat">
                                                <span class="standings-stat__label">Голи</span>
                                                <span class="standings-stat__value">${team.goalsFor}:${team.goalsAgainst}</span>
                                            </div>
                                            <div class="standings-stat">
                                                <span class="standings-stat__label">Різн</span>
                                                <span class="standings-stat__value">${team.goalDifference > 0 ? `+${team.goalDifference}` : team.goalDifference}</span>
                                            </div>
                                            <div class="standings-stat">
                                                <span class="standings-stat__label">Ігри</span>
                                                <span class="standings-stat__value">${team.played}</span>
                                            </div>
                                            <div class="standings-stat">
                                                <span class="standings-stat__label">Очки</span>
                                                <span class="standings-stat__value">${team.points}</span>
                                            </div>
                                        </div>
                                    </article>
                                `).join("")}
                            </div>
                        </div>

                        <div class="standings__note">Таблиця сформована з завершених матчів УПЛ із файлу matches.json</div>
                    </section>
                `;
            }

            async function load() {
                const content = document.getElementById("content");

                try {
                    const res = await fetch("./matches.json?cache=" + Date.now());

                    if (!res.ok) {
                        throw new Error("HTTP " + res.status);
                    }

                    const data = await res.json();
                    console.log("DATA LOADED:", data);

                    let html = "";

                    const allMatches = Object.values(data)
                        .filter(Array.isArray)
                        .flat()
                        .sort((a, b) => {
                            const aDate = `${a.dateIso || "9999-12-31"}T${a.time || "00:00"}`;
                            const bDate = `${b.dateIso || "9999-12-31"}T${b.time || "00:00"}`;
                            return new Date(aDate) - new Date(bDate);
                        });

                    if (!allMatches.length) {
                        content.innerHTML = "<div id='error'>❌ Немає даних</div>";
                        return;
                    }

                    const todayIso = getKyivTodayIso();
                    const hasTodayMatches = allMatches.some(m => m.dateIso === todayIso);
                    const matchesByDate = {};
                    allMatches.forEach(m => {
                        const dateKey = m.dateIso || m.date || "Інша дата";
                        if (!matchesByDate[dateKey]) {
                            matchesByDate[dateKey] = [];
                        }
                        matchesByDate[dateKey].push(m);
                    });

                    if (!hasTodayMatches) {
                        html += `<div class="empty" style="text-align: center; color: #ffcc00; font-size: 22px; margin: 20px 10px;">Сьогодні матчів немає</div>`;
                    }

                    Object.keys(matchesByDate)
                        .sort((a, b) => {
                            if (a === "Інша дата") return 1;
                            if (b === "Інша дата") return -1;
                            return new Date(a) - new Date(b);
                        })
                        .forEach(dateIso => {
                            const dateLabel = dateIso === "Інша дата" ? dateIso : formatDateUk(dateIso);
                            const dayClass = dateIso === todayIso ? "day day--today" : "day";
                            html += `<div class="${dayClass}" data-day="${dateIso}">${dateLabel}</div>`;

                            matchesByDate[dateIso].forEach(m => {
                                const scoreOrTime = m.score
                                    ? `<span class="score">${m.score}</span>`
                                    : m.time;

                                html += `
                <div class="match">
                    <div class="match__league">${renderLeagueLabel(m?.league || "")}</div>
                    <div class="match__body">
                        <div class="match__teams">
                            <span class="match__teams-main">${m?.home || "?"} – ${m?.away || "?"}</span>
                        </div>
                        <div class="time">${scoreOrTime}</div>
                    </div>
                </div>`;
                            });
                        });

                    content.innerHTML = html;
                    renderUplStandings(allMatches.filter(match => match.league === "УПЛ"));

                    const todayElement = document.querySelector(".day--today");
                    if (todayElement && !hasScrolledToToday) {
                        todayElement.scrollIntoView({ behavior: "smooth", block: "start" });
                        hasScrolledToToday = true;
                    }

                } catch (err) {
                    console.log(err);
                    content.innerHTML =
                        "<div id='error'>❌ JSON error: " + err.message + "</div>";
                }
            }

            load();
        </script>

    </body>
</html>
