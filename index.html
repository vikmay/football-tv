<!DOCTYPE html>
<html lang="uk">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
              content="width=device-width, initial-scale=1">
        <title>Football TV</title>

        <style>
            body {
                margin: 0;
                background: #0f0f0f;
                color: white;
                font-family: Arial;
            }

            .header {
                text-align: center;
                font-size: 50px;
                padding: 30px;
            }

            .day {
                color: #00ff88;
                font-size: 28px;
                margin: 20px;
                text-align: center;
            }

            .day--today {
                color: #ff3b30;
            }

            .match {
                background: #1e1e1e;
                margin: 10px auto;
                padding: 18px 20px 16px;
                max-width: 900px;
                border-radius: 12px;
                display: flex;
                flex-direction: column;
                gap: 10px;
                font-size: 26px;
            }

            .match__league {
                color: #ffcc00;
                font-size: 16px;
                font-weight: bold;
                text-align: center;
                text-transform: uppercase;
                letter-spacing: 0.08em;
            }

            .match__body {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 16px;
                width: 100%;
            }

            .match__teams {
                flex: 1;
                text-align: left;
                line-height: 1.25;
            }

            .match__teams-main {
                display: block;
            }

            .league {
                color: #aaa;
                font-size: 18px;
            }

            .time {
                color: #00ff88;
                font-weight: bold;
                white-space: nowrap;
            }

            .score {
                color: #ffcc00;
                font-weight: bold;
            }

            #error {
                text-align: center;
                color: red;
                font-size: 22px;
            }

            .empty {
                margin: 10px;
                color: #777;
            }

            @media (max-width: 600px) {
                .header {
                    font-size: 32px;
                    padding: 16px 12px;
                }

                .day {
                    font-size: 20px;
                    margin: 12px 12px;
                }

                .match {
                    font-size: 16px;
                    padding: 14px 12px 12px;
                    margin: 8px 10px;
                    gap: 8px;
                }

                .match__league {
                    font-size: 11px;
                }

                .match__body {
                    gap: 12px;
                }

                .time,
                .score {
                    font-size: 14px;
                }

                #error {
                    font-size: 16px;
                }
            }

            @media (max-width: 900px) and (orientation: portrait) {
                .header {
                    font-size: 38px;
                    padding: 18px 14px;
                }

                .day {
                    font-size: 24px;
                    margin: 14px 12px;
                }

                .match {
                    font-size: 18px;
                    padding: 16px 14px 14px;
                    margin: 10px 12px;
                    gap: 9px;
                }

                .match__league {
                    font-size: 12px;
                }

                .match__body {
                    gap: 14px;
                }

                .time,
                .score {
                    font-size: 16px;
                }

                #error {
                    font-size: 16px;
                }
            }
        </style>
    </head>

    <body>

        <div class="header">⚽ Football TV</div>
        <div id="content">Loading...</div>

        <script>
            let hasScrolledToToday = false;

            function getKyivTodayIso() {
                return new Intl.DateTimeFormat("en-CA", {
                    timeZone: "Europe/Kyiv",
                    year: "numeric",
                    month: "2-digit",
                    day: "2-digit"
                }).format(new Date());
            }

            function formatDateUk(dateIso) {
                const date = new Date(`${dateIso}T12:00:00Z`);
                const todayIso = getKyivTodayIso();
                const weekdays = [
                    "неділя",
                    "понеділок",
                    "вівторок",
                    "середа",
                    "четвер",
                    "пʼятниця",
                    "субота"
                ];
                const dayName = weekdays[date.getUTCDay()];
                const formattedDate = date.toLocaleDateString("uk-UA", {
                    timeZone: "Europe/Kyiv",
                    day: "numeric",
                    month: "long"
                });

                return dateIso === todayIso
                    ? `Сьогодні, ${formattedDate}`
                    : `${dayName}, ${formattedDate}`;
            }

            async function load() {
                const content = document.getElementById("content");

                try {
                    const res = await fetch("./matches.json?cache=" + Date.now());

                    if (!res.ok) {
                        throw new Error("HTTP " + res.status);
                    }

                    const data = await res.json();
                    console.log("DATA LOADED:", data);

                    let html = "";

                    const allMatches = Object.values(data)
                        .filter(Array.isArray)
                        .flat()
                        .sort((a, b) => {
                            const aDate = `${a.dateIso || "9999-12-31"}T${a.time || "00:00"}`;
                            const bDate = `${b.dateIso || "9999-12-31"}T${b.time || "00:00"}`;
                            return new Date(aDate) - new Date(bDate);
                        });

                    if (!allMatches.length) {
                        content.innerHTML = "<div id='error'>❌ Немає даних</div>";
                        return;
                    }

                    const todayIso = getKyivTodayIso();
                    const hasTodayMatches = allMatches.some(m => m.dateIso === todayIso);
                    const matchesByDate = {};
                    allMatches.forEach(m => {
                        const dateKey = m.dateIso || m.date || "Інша дата";
                        if (!matchesByDate[dateKey]) {
                            matchesByDate[dateKey] = [];
                        }
                        matchesByDate[dateKey].push(m);
                    });

                    if (!hasTodayMatches) {
                        html += `<div class="empty" style="text-align: center; color: #ffcc00; font-size: 22px; margin: 20px 10px;">Сьогодні матчів немає</div>`;
                    }

                    Object.keys(matchesByDate)
                        .sort((a, b) => {
                            if (a === "Інша дата") return 1;
                            if (b === "Інша дата") return -1;
                            return new Date(a) - new Date(b);
                        })
                        .forEach(dateIso => {
                            const dateLabel = dateIso === "Інша дата" ? dateIso : formatDateUk(dateIso);
                            const dayClass = dateIso === todayIso ? "day day--today" : "day";
                            html += `<div class="${dayClass}" data-day="${dateIso}">${dateLabel}</div>`;

                            matchesByDate[dateIso].forEach(m => {
                                const scoreOrTime = m.score
                                    ? `<span class="score">${m.score}</span>`
                                    : m.time;

                                html += `
                <div class="match">
                    <div class="match__league">${m?.league || ""}</div>
                    <div class="match__body">
                        <div class="match__teams">
                            <span class="match__teams-main">${m?.home || "?"} – ${m?.away || "?"}</span>
                        </div>
                        <div class="time">${scoreOrTime}</div>
                    </div>
                </div>`;
                            });
                        });

                    content.innerHTML = html;

                    const todayElement = document.querySelector(".day--today");
                    if (todayElement && !hasScrolledToToday) {
                        todayElement.scrollIntoView({ behavior: "smooth", block: "start" });
                        hasScrolledToToday = true;
                    }

                } catch (err) {
                    console.log(err);
                    content.innerHTML =
                        "<div id='error'>❌ JSON error: " + err.message + "</div>";
                }
            }

            load();
        </script>

    </body>
</html>
