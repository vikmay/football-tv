<!DOCTYPE html>
<html lang="uk">
    <head>
        <meta charset="UTF-8">
        <title>Football TV</title>

        <style>
            body {
                margin: 0;
                background: #0f0f0f;
                color: white;
                font-family: Arial;
            }

            .header {
                text-align: center;
                font-size: 50px;
                padding: 30px;
            }

            .day {
                color: #00ff88;
                font-size: 28px;
                margin: 20px;
                text-align: center;
            }

            .day--today {
                color: #ff3b30;
            }

            .match {
                background: #1e1e1e;
                margin: 10px auto;
                padding: 20px;
                max-width: 900px;
                border-radius: 12px;
                display: flex;
                justify-content: space-between;
                font-size: 26px;
            }

            .league {
                color: #aaa;
                font-size: 18px;
            }

            .time {
                color: #00ff88;
                font-weight: bold;
            }

            .score {
                color: #ffcc00;
                font-weight: bold;
            }

            #error {
                text-align: center;
                color: red;
                font-size: 22px;
            }

            .empty {
                margin: 10px;
                color: #777;
            }

            @media (max-width: 600px) {
                .header {
                    font-size: 144px;
                    padding: 28px 12px;
                }

                .day {
                    font-size: 96px;
                    margin: 24px 12px;
                }

                .match {
                    font-size: 84px;
                    padding: 28px;
                    margin: 16px 10px;
                }

                .league {
                    font-size: 60px;
                }

                .time,
                .score {
                    font-size: 78px;
                }

                #error {
                    font-size: 66px;
                }
            }

            @media (max-width: 900px) and (orientation: portrait) {
                .header {
                    font-size: 216px;
                    padding: 34px 14px;
                }

                .day {
                    font-size: 138px;
                    margin: 28px 12px;
                }

                .match {
                    font-size: 120px;
                    padding: 30px 18px;
                    margin: 18px 12px;
                }

                .league {
                    font-size: 78px;
                }

                .time,
                .score {
                    font-size: 114px;
                }

                #error {
                    font-size: 78px;
                }
            }
        </style>
    </head>

    <body>

        <div class="header">⚽ Football TV</div>
        <div id="content">Loading...</div>

        <script>
            async function load() {
                const content = document.getElementById("content");

                try {
                    const res = await fetch("./matches.json?cache=" + Date.now());

                    if (!res.ok) {
                        throw new Error("HTTP " + res.status);
                    }

                    const data = await res.json();
                    console.log("DATA LOADED:", data);

                    let html = "";

                    const allMatches = Object.values(data)
                        .filter(Array.isArray)
                        .flat()
                        .sort((a, b) => {
                            const aDate = `${a.dateIso || "9999-12-31"}T${a.time || "00:00"}`;
                            const bDate = `${b.dateIso || "9999-12-31"}T${b.time || "00:00"}`;
                            return new Date(aDate) - new Date(bDate);
                        });

                    if (!allMatches.length) {
                        content.innerHTML = "<div id='error'>❌ Немає даних</div>";
                        return;
                    }

                    // Групуємо всі матчі по даті незалежно від ліги
                    const matchesByDate = {};
                    allMatches.forEach(m => {
                        const dateKey = m.date || "Інша дата";
                        if (!matchesByDate[dateKey]) {
                            matchesByDate[dateKey] = [];
                        }
                        matchesByDate[dateKey].push(m);
                    });

                    // Виводимо групи по датах у хронологічному порядку
                    Object.keys(matchesByDate).forEach(date => {
                        const dayClass = date.startsWith("Сьогодні") ? "day day--today" : "day";
                        html += `<div class="${dayClass}" data-day="${date}">${date}</div>`;

                        matchesByDate[date].forEach(m => {
                            // Показуємо рахунок якщо матч завершений, інакше час
                            const scoreOrTime = m.score
                                ? `<span class="score">${m.score}</span>`
                                : m.time;

                            html += `
                <div class="match">
                    <div>
                        ${m?.home || "?"} – ${m?.away || "?"}
                        <div class="league">${m?.league || ""}</div>
                    </div>
                    <div class="time">${scoreOrTime}</div>
                </div>`;
                        });
                    });

                    content.innerHTML = html;

                    const todayElement = document.querySelector(".day--today");
                    if (todayElement) {
                        todayElement.scrollIntoView({ behavior: "smooth", block: "start" });
                    }

                } catch (err) {
                    console.log(err);
                    content.innerHTML =
                        "<div id='error'>❌ JSON error: " + err.message + "</div>";
                }
            }

            load();
            setInterval(load, 60000);
        </script>

    </body>
</html>
