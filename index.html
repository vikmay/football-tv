<!DOCTYPE html>
<html lang="uk">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
              content="width=device-width, initial-scale=1">
        <title>Football TV</title>

        <style>
            body {
                margin: 0;
                background: #0f0f0f;
                color: white;
                font-family: Arial;
            }

            .header {
                text-align: center;
                font-size: 50px;
                padding: 30px;
            }

            .day {
                color: #00ff88;
                font-size: 28px;
                margin: 20px;
                text-align: center;
            }

            .day--today {
                color: #ff3b30;
            }

            .match {
                background: #1e1e1e;
                margin: 10px auto;
                padding: 18px 20px 16px;
                max-width: 900px;
                border-radius: 12px;
                display: flex;
                flex-direction: column;
                gap: 10px;
                font-size: 26px;
            }

            .match__league {
                color: #ffcc00;
                font-size: 16px;
                font-weight: bold;
                text-align: center;
                text-transform: uppercase;
                letter-spacing: 0.08em;
            }

            .match__league-stage {
                color: #7dd3fc;
            }

            .match__body {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 16px;
                width: 100%;
            }

            .match__teams {
                flex: 1;
                text-align: left;
                line-height: 1.25;
            }

            .match__teams-main {
                display: block;
            }

            .league {
                color: #aaa;
                font-size: 18px;
            }

            .time {
                color: #00ff88;
                font-weight: bold;
                white-space: nowrap;
            }

            .score {
                color: #ffcc00;
                font-weight: bold;
            }

            #error {
                text-align: center;
                color: red;
                font-size: 22px;
            }

            .empty {
                margin: 10px;
                color: #777;
            }

            .standings {
                max-width: 980px;
                margin: 40px auto 24px;
                padding: 18px 16px 20px;
                background: #161616;
                border-radius: 12px;
                font-family: Arial, sans-serif;
            }

            .standings__title {
                margin: 0 0 14px;
                text-align: center;
                font-size: 28px;
                color: #ffcc00;
            }

            .standings__table-wrap {
                border: 1px solid #2a2a2a;
                border-radius: 12px;
                background: #121212;
                overflow: hidden;
            }

            .standings__table {
                width: 100%;
                border-collapse: collapse;
                font-size: 17px;
                table-layout: fixed;
            }

            .standings__table col.standings__col--rank {
                width: 3%;
            }

            .standings__table col.standings__col--team {
                width: 32%;
            }

            .standings__table col.standings__col--played,
            .standings__table col.standings__col--wins,
            .standings__table col.standings__col--draws,
            .standings__table col.standings__col--losses {
                width: 5%;
            }

            .standings__table col.standings__col--goals {
                width: 18%;
            }

            .standings__table col.standings__col--difference {
                width: 12%;
            }

            .standings__table col.standings__col--points {
                width: 10%;
            }

            .standings__table th {
                padding: 10px 6px;
                border-bottom: 1px solid #2a2a2a;
                text-align: center;
                vertical-align: middle;
                overflow: hidden;
                font-size: 12px;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                color: #d9d9d9;
                background: rgba(255, 255, 255, 0.04);
            }

            .standings__table th:nth-child(2),
            .standings__table td:nth-child(2) {
                text-align: left;
                padding-left: 0;
                padding-right: 0;
                padding-inline-start: 0;
                padding-inline-end: 0;
            }

            .standings__table td {
                padding: 10px 6px;
                border-bottom: 1px solid #2a2a2a;
                text-align: center;
                vertical-align: middle;
                overflow: hidden;
                font-size: 19px;
            }

            .standings__table tr:last-child td {
                border-bottom: 0;
            }

            .standings__table tr:hover td {
                background: rgba(255, 255, 255, 0.02);
            }

            .standings__rank-cell {
                color: #a8a8a8;
                font-weight: 700;
            }

            .standings__team-cell {
                text-align: left;
                padding-left: 0;
                padding-right: 0;
                font-weight: 700;
                color: #fff;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: clip;
                line-height: 1.15;
                font-size: 16px;
            }

            .standings__points-cell {
                color: #00ff88;
                font-weight: 900;
                font-size: 20px;
                background: rgba(0, 255, 136, 0.12);
                border-left: 1px solid rgba(0, 255, 136, 0.18);
                border-right: 1px solid rgba(0, 255, 136, 0.18);
            }

            .standings__note {
                margin-top: 10px;
                color: #888;
                font-size: 14px;
                text-align: center;
            }

            @media (max-width: 600px) {
                .header {
                    font-size: 32px;
                    padding: 16px 12px;
                }

                .day {
                    font-size: 20px;
                    margin: 12px 12px;
                }

                .match {
                    font-size: 16px;
                    padding: 14px 12px 12px;
                    margin: 8px 10px;
                    gap: 8px;
                }

                .match__league {
                    font-size: 11px;
                }

                .match__body {
                    gap: 12px;
                }

                .time,
                .score {
                    font-size: 14px;
                }

                #error {
                    font-size: 16px;
                }

                .standings {
                    margin: 20px 2px 12px;
                    padding: 6px 1px 4px;
                }

                .standings__title {
                    font-size: 16px;
                    margin-bottom: 6px;
                }

                .standings__table {
                    font-size: 8px;
                }

                .standings__table th,
                .standings__table td {
                    padding: 3px 1px;
                }

                .standings__table col.standings__col--rank {
                    width: 4%;
                }

                .standings__table col.standings__col--team {
                    width: 58%;
                }

                .standings__table col.standings__col--played,
                .standings__table col.standings__col--wins,
                .standings__table col.standings__col--draws,
                .standings__table col.standings__col--losses {
                    width: 4%;
                }

                .standings__table col.standings__col--goals {
                    width: 9%;
                }

                .standings__table col.standings__col--difference {
                    width: 8%;
                }

                .standings__table col.standings__col--points {
                    width: 6%;
                }

                .standings__team-cell {
                    white-space: nowrap;
                    overflow: hidden;
                    text-overflow: clip;
                    font-size: 8px;
                    line-height: 1;
                    padding-left: 0;
                    padding-right: 0;
                }

                .standings__note {
                    font-size: 10px;
                    line-height: 1.25;
                    margin-top: 6px;
                }
            }

            @media (max-width: 420px) {
                .standings {
                    margin-left: 1px;
                    margin-right: 1px;
                    padding-left: 1px;
                    padding-right: 1px;
                }

                .standings__table {
                    font-size: 7.5px;
                }

                .standings__table th,
                .standings__table td {
                    padding: 2px 1px;
                }

                .standings__table col.standings__col--team {
                    width: 60%;
                }

                .standings__table col.standings__col--goals {
                    width: 9%;
                }

                .standings__table col.standings__col--difference {
                    width: 7%;
                }

                .standings__table col.standings__col--points {
                    width: 6%;
                }

                .standings__team-cell {
                    font-size: 7.5px;
                    padding-left: 0;
                    padding-right: 0;
                }
            }

            @media (max-width: 900px) and (orientation: portrait) {
                .header {
                    font-size: 38px;
                    padding: 18px 14px;
                }

                .day {
                    font-size: 24px;
                    margin: 14px 12px;
                }

                .match {
                    font-size: 18px;
                    padding: 16px 14px 14px;
                    margin: 10px 12px;
                    gap: 9px;
                }

                .match__league {
                    font-size: 12px;
                }

                .match__body {
                    gap: 14px;
                }

                .time,
                .score {
                    font-size: 16px;
                }

                #error {
                    font-size: 16px;
                }
            }
        </style>
    </head>

    <body>

        <div class="header">⚽ Football TV</div>
        <div id="content">Loading...</div>
        <div id="standings"></div>

        <script>
            let hasScrolledToToday = false;

            function renderLeagueLabel(label) {
                return String(label || "").replace(/\s*\(([^)]+)\)/, ' <span class="match__league-stage">($1)</span>');
            }

            function getKyivTodayIso() {
                return new Intl.DateTimeFormat("en-CA", {
                    timeZone: "Europe/Kyiv",
                    year: "numeric",
                    month: "2-digit",
                    day: "2-digit"
                }).format(new Date());
            }

            function formatDateUk(dateIso) {
                const date = new Date(`${dateIso}T12:00:00Z`);
                const todayIso = getKyivTodayIso();
                const weekdays = [
                    "неділя",
                    "понеділок",
                    "вівторок",
                    "середа",
                    "четвер",
                    "пʼятниця",
                    "субота"
                ];
                const dayName = weekdays[date.getUTCDay()];
                const formattedDate = date.toLocaleDateString("uk-UA", {
                    timeZone: "Europe/Kyiv",
                    day: "numeric",
                    month: "long"
                });

                return dateIso === todayIso
                    ? `Сьогодні, ${formattedDate}`
                    : `${dayName}, ${formattedDate}`;
            }

            const uplStandings = [
                { position: 1, team: "Шахтар Донецьк", played: 23, wins: 16, draws: 6, losses: 1, goalsFor: 54, goalsAgainst: 14, goalDifference: 40, points: 54 },
                { position: 2, team: "ЛНЗ Черкаси", played: 24, wins: 16, draws: 3, losses: 5, goalsFor: 35, goalsAgainst: 15, goalDifference: 20, points: 51 },
                { position: 3, team: "Полісся Житомир", played: 24, wins: 14, draws: 4, losses: 6, goalsFor: 41, goalsAgainst: 16, goalDifference: 25, points: 46 },
                { position: 4, team: "Металіст 1925 Харків", played: 24, wins: 12, draws: 8, losses: 4, goalsFor: 30, goalsAgainst: 13, goalDifference: 17, points: 44 },
                { position: 5, team: "Динамо Київ", played: 24, wins: 13, draws: 5, losses: 6, goalsFor: 52, goalsAgainst: 26, goalDifference: 26, points: 44 },
                { position: 6, team: "Кривбас Кривий Ріг", played: 24, wins: 11, draws: 7, losses: 6, goalsFor: 38, goalsAgainst: 32, goalDifference: 6, points: 40 },
                { position: 7, team: "Колос Ковалівка", played: 24, wins: 9, draws: 10, losses: 5, goalsFor: 22, goalsAgainst: 21, goalDifference: 1, points: 37 },
                { position: 8, team: "Карпати Львів", played: 24, wins: 8, draws: 9, losses: 7, goalsFor: 32, goalsAgainst: 26, goalDifference: 6, points: 33 },
                { position: 9, team: "Зоря Луганськ", played: 23, wins: 8, draws: 8, losses: 7, goalsFor: 32, goalsAgainst: 30, goalDifference: 2, points: 32 },
                { position: 10, team: "Верес Рівне", played: 24, wins: 7, draws: 8, losses: 9, goalsFor: 22, goalsAgainst: 29, goalDifference: -7, points: 29 },
                { position: 11, team: "Епіцентр Кам'янець-Подільський", played: 24, wins: 7, draws: 3, losses: 14, goalsFor: 26, goalsAgainst: 36, goalDifference: -10, points: 24 },
                { position: 12, team: "Оболонь Київ", played: 23, wins: 5, draws: 8, losses: 10, goalsFor: 18, goalsAgainst: 39, goalDifference: -21, points: 23 },
                { position: 13, team: "Кудрівка", played: 24, wins: 5, draws: 6, losses: 13, goalsFor: 25, goalsAgainst: 39, goalDifference: -14, points: 21 },
                { position: 14, team: "Рух Львів", played: 24, wins: 6, draws: 2, losses: 16, goalsFor: 17, goalsAgainst: 39, goalDifference: -22, points: 20 },
                { position: 15, team: "Олександрія", played: 23, wins: 2, draws: 6, losses: 15, goalsFor: 17, goalsAgainst: 45, goalDifference: -28, points: 12 },
                { position: 16, team: "Полтава", played: 24, wins: 2, draws: 5, losses: 17, goalsFor: 20, goalsAgainst: 61, goalDifference: -41, points: 11 }
            ];

            function renderUplStandings() {
                const standingsHost = document.getElementById("standings");

                standingsHost.innerHTML = `
                    <section class="standings">
                        <h2 class="standings__title">Таблиця УПЛ</h2>
                        <div class="standings__table-wrap">
                            <table class="standings__table">
                                <colgroup>
                                    <col class="standings__col standings__col--rank">
                                    <col class="standings__col standings__col--team">
                                    <col class="standings__col standings__col--played">
                                    <col class="standings__col standings__col--wins">
                                    <col class="standings__col standings__col--draws">
                                    <col class="standings__col standings__col--losses">
                                    <col class="standings__col standings__col--goals">
                                    <col class="standings__col standings__col--difference">
                                    <col class="standings__col standings__col--points">
                                </colgroup>
                                <thead>
                                    <tr>
                                        <th>№</th>
                                        <th>Команда</th>
                                        <th>М</th>
                                        <th>В</th>
                                        <th>Н</th>
                                        <th>П</th>
                                        <th>Г</th>
                                        <th>Р</th>
                                        <th>О</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${uplStandings.map(team => `
                                        <tr>
                                            <td class="standings__rank-cell">${team.position}</td>
                                            <td class="standings__team-cell">${team.team}</td>
                                            <td>${team.played}</td>
                                            <td>${team.wins}</td>
                                            <td>${team.draws}</td>
                                            <td>${team.losses}</td>
                                            <td>${team.goalsFor}:${team.goalsAgainst}</td>
                                            <td>${team.goalDifference > 0 ? `+${team.goalDifference}` : team.goalDifference}</td>
                                            <td class="standings__points-cell">${team.points}</td>
                                        </tr>
                                    `).join("")}
                                </tbody>
                            </table>
                        </div>
                        <div class="standings__note">Актуальна таблиця з офіційного сайту УПЛ: upl.ua/en/tournaments/championship/428/table</div>
                    </section>
                `;
            }

            async function load() {
                const content = document.getElementById("content");

                try {
                    const res = await fetch("./matches.json?cache=" + Date.now());

                    if (!res.ok) {
                        throw new Error("HTTP " + res.status);
                    }

                    const data = await res.json();
                    console.log("DATA LOADED:", data);

                    let html = "";

                    const allMatches = Object.values(data)
                        .filter(Array.isArray)
                        .flat()
                        .sort((a, b) => {
                            const aDate = `${a.dateIso || "9999-12-31"}T${a.time || "00:00"}`;
                            const bDate = `${b.dateIso || "9999-12-31"}T${b.time || "00:00"}`;
                            return new Date(aDate) - new Date(bDate);
                        });

                    if (!allMatches.length) {
                        content.innerHTML = "<div id='error'>❌ Немає даних</div>";
                        return;
                    }

                    const todayIso = getKyivTodayIso();
                    const hasTodayMatches = allMatches.some(m => m.dateIso === todayIso);
                    const matchesByDate = {};
                    allMatches.forEach(m => {
                        const dateKey = m.dateIso || m.date || "Інша дата";
                        if (!matchesByDate[dateKey]) {
                            matchesByDate[dateKey] = [];
                        }
                        matchesByDate[dateKey].push(m);
                    });

                    if (!hasTodayMatches) {
                        html += `<div class="empty" style="text-align: center; color: #ffcc00; font-size: 22px; margin: 20px 10px;">Сьогодні матчів немає</div>`;
                    }

                    Object.keys(matchesByDate)
                        .sort((a, b) => {
                            if (a === "Інша дата") return 1;
                            if (b === "Інша дата") return -1;
                            return new Date(a) - new Date(b);
                        })
                        .forEach(dateIso => {
                            const dateLabel = dateIso === "Інша дата" ? dateIso : formatDateUk(dateIso);
                            const dayClass = dateIso === todayIso ? "day day--today" : "day";
                            html += `<div class="${dayClass}" data-day="${dateIso}">${dateLabel}</div>`;

                            matchesByDate[dateIso].forEach(m => {
                                const scoreOrTime = m.score
                                    ? `<span class="score">${m.score}</span>`
                                    : m.time;

                                html += `
                <div class="match">
                    <div class="match__league">${renderLeagueLabel(m?.league || "")}</div>
                    <div class="match__body">
                        <div class="match__teams">
                            <span class="match__teams-main">${m?.home || "?"} – ${m?.away || "?"}</span>
                        </div>
                        <div class="time">${scoreOrTime}</div>
                    </div>
                </div>`;
                            });
                        });

                    content.innerHTML = html;
                    renderUplStandings();

                    const todayElement = document.querySelector(".day--today");
                    if (todayElement && !hasScrolledToToday) {
                        todayElement.scrollIntoView({ behavior: "smooth", block: "start" });
                        hasScrolledToToday = true;
                    }

                } catch (err) {
                    console.log(err);
                    content.innerHTML =
                        "<div id='error'>❌ JSON error: " + err.message + "</div>";
                }
            }

            load();
        </script>

    </body>
</html>
