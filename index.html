<!DOCTYPE html>
<html lang="uk">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
              content="width=device-width, initial-scale=1">
        <title>Football TV</title>

        <style>
            body {
                margin: 0;
                background: #0f0f0f;
                color: white;
                font-family: Arial;
            }

            .header {
                text-align: center;
                font-size: 50px;
                padding: 30px;
            }

            .day {
                color: #00ff88;
                font-size: 28px;
                margin: 20px;
                text-align: center;
            }

            .day--today {
                color: #ff3b30;
            }

            .match {
                background: #1e1e1e;
                margin: 10px auto;
                padding: 18px 20px 16px;
                max-width: 900px;
                border-radius: 12px;
                display: flex;
                flex-direction: column;
                gap: 10px;
                font-size: 26px;
            }

            .match__league {
                color: #ffcc00;
                font-size: 16px;
                font-weight: bold;
                text-align: center;
                text-transform: uppercase;
                letter-spacing: 0.08em;
            }

            .match__league-stage {
                color: #7dd3fc;
            }

            .match__body {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 16px;
                width: 100%;
            }

            .match__teams {
                flex: 1;
                text-align: left;
                line-height: 1.25;
            }

            .match__teams-main {
                display: block;
            }

            .league {
                color: #aaa;
                font-size: 18px;
            }

            .time {
                color: #00ff88;
                font-weight: bold;
                white-space: nowrap;
            }

            .score {
                color: #ffcc00;
                font-weight: bold;
            }

            #error {
                text-align: center;
                color: red;
                font-size: 22px;
            }

            .empty {
                margin: 10px;
                color: #777;
            }

            .empty--red {
                color: #ff3b30;
                text-align: center;
                font-size: 24px;
                margin: 10px 10px 0;
            }

            .standings {
                max-width: 980px;
                margin: 40px auto 24px;
                padding: 18px 16px 20px;
                background: #161616;
                border-radius: 12px;
                font-family: Arial, sans-serif;
            }

            .standings__title {
                margin: 0 0 14px;
                text-align: center;
                font-size: 28px;
                color: #ffcc00;
            }

            .standings__table-wrap {
                border: 1px solid #2a2a2a;
                border-radius: 12px;
                background: #121212;
                overflow: hidden;
            }

            .standings__table {
                width: 100%;
                border-collapse: collapse;
                font-size: 17px;
                table-layout: fixed;
            }

            .standings__table col.standings__col--rank {
                width: 3%;
            }

            .standings__table col.standings__col--team {
                width: 32%;
            }

            .standings__table col.standings__col--played,
            .standings__table col.standings__col--wins,
            .standings__table col.standings__col--draws,
            .standings__table col.standings__col--losses {
                width: 5%;
            }

            .standings__table col.standings__col--goals {
                width: 18%;
            }

            .standings__table col.standings__col--difference {
                width: 12%;
            }

            .standings__table col.standings__col--points {
                width: 10%;
            }

            .standings__table th {
                padding: 10px 6px;
                border-bottom: 1px solid #2a2a2a;
                text-align: center;
                vertical-align: middle;
                overflow: hidden;
                font-size: 12px;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                color: #d9d9d9;
                background: rgba(255, 255, 255, 0.04);
            }

            .standings__table th:nth-child(2),
            .standings__table td:nth-child(2) {
                text-align: left;
                padding-left: 10px;
                padding-right: 0;
                padding-inline-start: 10px;
                padding-inline-end: 0;
            }

            .standings__table td {
                padding: 10px 6px;
                border-bottom: 1px solid #2a2a2a;
                text-align: center;
                vertical-align: middle;
                overflow: hidden;
                font-size: 19px;
            }

            .standings__table tr:last-child td {
                border-bottom: 0;
            }

            .standings__table tr:hover td {
                background: rgba(255, 255, 255, 0.02);
            }

            .standings__rank-cell {
                color: #a8a8a8;
                font-weight: 700;
            }

            .standings__team-cell {
                text-align: left;
                padding-left: 0;
                padding-right: 0;
                font-weight: 700;
                color: #fff;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: clip;
                line-height: 1.15;
                font-size: 16px;
            }

            .standings__points-cell {
                color: #00ff88;
                font-weight: 900;
                font-size: 20px;
                background: rgba(0, 255, 136, 0.12);
                border-left: 1px solid rgba(0, 255, 136, 0.18);
                border-right: 1px solid rgba(0, 255, 136, 0.18);
            }

            .standings__status-cell--qualified {
                color: #14a85a;
                font-weight: 900;
            }

            .standings__status-cell--eliminated {
                color: #e03131;
                font-weight: 900;
            }

            .standings__rank-cell--qualified {
                background: #14a85a;
                color: #fff;
                font-weight: 900;
            }

            .standings__rank-cell--third {
                background: #f0b429;
                color: #1d1d1d;
                font-weight: 900;
            }

            .standings__rank-cell--third-qualified {
                background: #14a85a;
                color: #fff;
                font-weight: 900;
            }

            .standings__rank-cell--eliminated {
                background: #e03131;
                color: #fff;
                font-weight: 900;
            }

            .standings__note {
                margin-top: 10px;
                color: #888;
                font-size: 14px;
                text-align: center;
            }

            .standings__legend {
                display: flex;
                flex-wrap: wrap;
                gap: 8px 12px;
                justify-content: center;
                margin-top: 10px;
                color: #aaa;
                font-size: 12px;
                line-height: 1.25;
            }

            .standings__legend-item {
                display: inline-flex;
                align-items: center;
                gap: 5px;
            }

            .standings__legend-dot {
                width: 9px;
                height: 9px;
                border-radius: 2px;
                display: inline-block;
            }

            .standings__legend-dot--qualified,
            .standings__legend-dot--third-qualified {
                background: #14a85a;
            }

            .standings__legend-dot--third {
                background: #f0b429;
            }

            .standings__legend-dot--eliminated {
                background: #e03131;
            }

            @media (max-width: 600px) {
                .header {
                    font-size: 32px;
                    padding: 16px 12px;
                }

                .day {
                    font-size: 20px;
                    margin: 12px 12px;
                }

                    font-size: 16px;
                    padding: 14px 12px 12px;

                }

                }

                .match__body {
                    gap: 12px;
                }

                .time,

                }

                #error {

                }

                .standings {

                    padding: 6px 1px 4px;
                }

                .standings__title {
                    font-size: 16px;
                    margin-bottom: 6px;
                }

                .standings__table {
                    font-size: 8px;
                }

                .standings__table th,
                .standings__table td {
                    padding: 3px 1px;
                }

                .standings__table col.standings__col--rank {
                    width: 4%;

                .standings__table col.standings__col--team {
                    width: 58%;

                .standings__table col.standings__col--played,
                .standings__table col.standings__col--wins,
                .standings__table col.standings__col--draws,

                .standings__table col.standings__col--goals {

                .standings__table col.standings__col--difference {

                .standings__team-cell {
                    white-space: nowrap;
                    overflow: hidden;
                    text-overflow: clip;
                    font-size: 8px;
                    line-height: 1;
                    padding-left: 0;
                    padding-right: 0;
                }

                .standings__note {
                    font-size: 10px;
                    line-height: 1.25;
                    margin-top: 6px;
                }
            }

            @media (max-width: 420px) {
                .standings {
                    margin-left: 1px;
                    margin-right: 1px;
                    padding-left: 1px;
                    padding-right: 1px;
                }

                .standings__table {

                }

                .standings__table th,
                .standings__table td {
                    padding: 2px 1px;
                }

                .standings__table th:nth-child(2),
                .standings__table td:nth-child(2) {

                }

                .standings__table col.standings__col--team {
                    width: 60%;
                }

.standings__table col.standings__col--goals {

            .standings__table col.standings__col--points {

            .standings__table col.standings__col--goals-for {

            .standings__table col.standings__col--status {

                .standings__team-cell {

                }

                .standings__table col.standings__col--goals-for {

                .standings__note {

            /* Bracket CSS */
            .bracket-container {
                overflow-x: auto;
                padding: 20px;
                margin: 20px auto;
                max-width: 100%; /* Changed from 1200px to allow fitting on TV screens */
                background: #161616;
                border-radius: 12px;
            }
            
            .bracket-title {
                text-align: center;
                font-size: 28px;
                color: #ffcc00;
                margin-bottom: 20px;
            }

            .bracket {
                display: flex;
                flex-direction: row;
                justify-content: center; /* Center bracket on large screens */
                gap: 20px;
                min-width: max-content;
            }

            .bracket-column-wrapper {
                display: flex;
                flex-direction: column;
                min-width: 160px;
                gap: 15px;
            }

            .bracket-column {
                display: flex;
                flex-direction: column;
                justify-content: space-around;
                flex: 1;
            }
            
            .bracket-pair {
                display: flex;
                flex-direction: column;
                justify-content: space-around;
                flex: 1;
                position: relative;
                min-height: 120px;
            }

            .bracket-column-wrapper:not(:last-child) .bracket-pair::after {
                content: "";
                position: absolute;
                right: -10px;
                top: 25%;
                bottom: 25%;
                width: 10px;
                border-right: 2px solid #555;
                border-top: 2px solid #555;
                border-bottom: 2px solid #555;
                border-radius: 0 4px 4px 0;
            }

            .bracket-column-wrapper:not(:last-child) .bracket-pair::before {
                content: "";
                position: absolute;
                right: -20px;
                top: 50%;
                width: 10px;
                border-top: 2px solid #555;
            }
            
            .bracket-match-title {
                text-align: center;
                color: #7dd3fc;
                font-weight: bold;
                font-size: 11px;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                margin-bottom: 6px;
                padding-bottom: 6px;
                border-bottom: 1px solid #2a2a2a;
            }

            .bracket-match {
                background: #1e1e1e;
                border-radius: 8px;
                padding: 8px;
                display: flex;
                flex-direction: column;
                font-size: 14px;
                position: relative;
                border: 1px solid #2a2a2a;
                margin: 5px 0;
            }

            .bracket-team {
                display: flex;
                justify-content: space-between;
                padding: 6px 4px;
                border-bottom: 1px solid #2a2a2a;
            }

            .bracket-team:last-child {
                border-bottom: none;
            }

            .bracket-team-name {
                color: #fff;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                max-width: 100px;
            }

            .bracket-team-score {
                color: #ffcc00;
                font-weight: bold;
                min-width: 20px;
                text-align: right;
            }

            .bracket-match-status {
                font-size: 10px;
                color: #888;
                text-align: center;
                margin-bottom: 6px;
                text-transform: uppercase;
            }
            
            @media (max-width: 600px) {
                .bracket-container {
                    padding: 10px;
                    margin: 10px;
                }
                .bracket-column-wrapper {
                    min-width: 200px;
                    gap: 10px;
                }
                .bracket-team-name {
                    max-width: 100px;
                }
            } /* Close @media (max-width: 600px) */

            @media (min-width: 1400px) {
                .bracket-container {
                    overflow-x: hidden; /* Force disable scroll on very large screens */
                }
            }
        </style>
    </head>

        <script>
            let hasScrolledToToday = false;

            function renderLeagueLabel(label) {
                return String(label || "").replace(/\s*\(([^)]+)\)/, ' <span class="match__league-stage">($1)</span>');
            }

            function getKyivTodayIso() {
                return new Intl.DateTimeFormat("en-CA", {
                    timeZone: "Europe/Kyiv",
                    year: "numeric",
                    month: "2-digit",
                    day: "2-digit"
                }).format(new Date());
            }

            function formatDateUk(dateIso) {
                const date = new Date(`${dateIso}T12:00:00Z`);
                const todayIso = getKyivTodayIso();
                const weekdays = [
                    "неділя",
                    "понеділок",
                    "вівторок",
                    "середа",
                    "четвер",
                    "пʼятниця",
                    "субота"
                ];
                const dayName = weekdays[date.getUTCDay()];
                const formattedDate = date.toLocaleDateString("uk-UA", {
                    timeZone: "Europe/Kyiv",
                    day: "numeric",
                    month: "long"
                });

                return dateIso === todayIso
                    ? `Сьогодні, ${dayName}, ${formattedDate}`
                    : `${dayName}, ${formattedDate}`;
            }


            function normalizeMatchTeamName(teamName) {
                const cleaned = String(teamName || "")
                    .replace(/^«+/, "")
                    .replace(/»+$/, "")
                    .replace(/^"+/, "")
                    .replace(/"+$/, "")
                    .trim();

                const aliases = {
                    // existing
                    "Ноттінгем": "Ноттінгем Форест",
                    "Nottingham": "Nottingham Forest",

                    // УПЛ: normalize variants for dedupeKey only
                    "Полтава": "СК Полтава",
                    "СК Полтава": "СК Полтава",

                    "Оболонь": "Оболонь Київ",
                    "Оболонь Київ": "Оболонь Київ",

                    "Зоря": "Зоря Луганськ",
                    "Зоря Луганськ": "Зоря Луганськ",

                    "Рух": "Рух Львів",
                    "Рух Львів": "Рух Львів",

                    "Верес": "Верес Рівне",
                    "Верес Рівне": "Верес Рівне",

                    "Полісся Ж.": "Полісся Житомир",
                    "Полісся Житомир": "Полісся Житомир",

                    "Карпати Л.": "Карпати Львів",
                    "Карпати Львів": "Карпати Львів",

                    "Епіцентр Кам'янець-Подільський": "Епіцентр",
                    "Епіцентр": "Епіцентр",

                    "Колос": "Колос Ковалівка",
                    "Колос Ковалівка": "Колос Ковалівка"
                };

                if (cleaned === "Епіцентр Кам'янець-Подільський") {
                    return "Епіцентр";
                }

                const duplicateMatch = cleaned.match(/^(.+?)\s+\1$/i);
                if (duplicateMatch) {
                    return duplicateMatch[1];
                }

                return aliases[cleaned] || cleaned;
            }

            function getStandingsTeamLabel(teamName) {
                return normalizeMatchTeamName(teamName);
            }

                return `Таблиця ЧС 2026 — Група ${groupLetter}`;

            function getWorldCupTeamName(name) {
                const cleaned = String(name || "").trim();
                return worldCupTeamNames[cleaned] || cleaned;
            }

            function parseNumberCell(text) {
                const cleaned = String(text || "").replace(/\s+/g, " ").trim();
                const n = Number(cleaned);
                return Number.isFinite(n) ? n : null;
            }

            function escapeHtml(value) {
                return String(value ?? "").replace(/[&<>"']/g, char => ({
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#039;"
                }[char]));
            }

            function formatSignedNumber(value) {
                const number = Number(value);
                if (!Number.isFinite(number)) return "";
                return number > 0 ? `+${number}` : String(number);
            }

            function getWorldCupGroupLetters() {
                return ["A", "B", "C", "D", "E", "F", "G", "H", "I", "J", "K", "L"];
            }

            function getWorldCupThirdPlaceRows(standingsByGroup) {
                return getWorldCupGroupLetters()
                    .map(groupLetter => {
                        const rows = Array.isArray(standingsByGroup?.[groupLetter]) ? standingsByGroup[groupLetter] : [];
                        const thirdPlaceRow = rows.find(row => Number(row?.position) === 3);

                        return thirdPlaceRow ? {
                            ...thirdPlaceRow,
                            groupLetter
                        } : null;
                    })
                    .filter(Boolean);
            }

            function sortWorldCupThirdPlaceRows(rows) {
                return [...rows].sort((a, b) => {
                    const pointsDiff = (Number(b.points) || 0) - (Number(a.points) || 0);
                    if (pointsDiff !== 0) return pointsDiff;

                    const goalDifferenceDiff = (Number(b.goalDifference) || 0) - (Number(a.goalDifference) || 0);
                    if (goalDifferenceDiff !== 0) return goalDifferenceDiff;

                    const goalsForDiff = (Number(b.goalsFor) || 0) - (Number(a.goalsFor) || 0);
                    if (goalsForDiff !== 0) return goalsForDiff;

                    return String(a.teamName || "").localeCompare(String(b.teamName || ""), "uk");
                });
            }

            function getWorldCupQualifiedThirdPlaceGroups(rows) {
                return new Set(sortWorldCupThirdPlaceRows(rows).slice(0, 8).map(row => row.groupLetter));
            }

            function getWorldCupGroupRowClass(row) {
                const position = Number(row?.position);

                if (position === 1 || position === 2) {
                    return "standings__rank-cell--qualified";
                }

                if (position === 3) {
                    return "standings__rank-cell--third";
                }

                if (position === 4) {
                    return "standings__rank-cell--eliminated";
                }

                return "";

            async function renderWorldCup2026Bracket(data) {
                const standingsHost = document.getElementById("standings");
                const matches = Object.values(data)
                    .filter(Array.isArray)
                    .flat()
                    .filter(m => m?.league?.startsWith("Чемпіонат світу"));

                const stages = [
                    { key: "1/16", title: "1/16 фіналу", count: 16 },
                    { key: "1/8", title: "1/8 фіналу", count: 8 },
                    { key: "Чвертьфінал", title: "1/4 фіналу", count: 4 },
                    { key: "Півфінал", title: "Півфінал", count: 2 },
                    { key: "Фінал", title: "Фінал", count: 1 }
                ];
                
                const matchesByStage = {};
                stages.forEach(stage => matchesByStage[stage.key] = []);

                matches.forEach(m => {
                    for (const stage of stages) {
                        if (m.league.includes(stage.key)) {
                            matchesByStage[stage.key].push(m);
                            break;
                        }
                    }
                });

                // Deduplicate matches
                stages.forEach(stage => {
                    const unique = new Map();
                    matchesByStage[stage.key].forEach(m => {
                        const key = [m.dateIso, m.home, m.away].join("|");
                        const existing = unique.get(key);
                        if (!existing || (m.score && !existing.score)) {
                            unique.set(key, m);
                        }
                    });
                    
                    matchesByStage[stage.key] = [...unique.values()].sort((a, b) => {
                        const aDate = new Date(`${a.dateIso || "9999-12-31"}T${a.originalTime || a.time || "00:00"}`);
                        const bDate = new Date(`${b.dateIso || "9999-12-31"}T${b.originalTime || b.time || "00:00"}`);
                        return aDate - bDate;
                    });
                });

                let html = '<div class="bracket-container"><h2 class="bracket-title">Плей-оф ЧС 2026</h2><div class="bracket">';

                function renderMatch(m, stageTitle) {
                    if (!m) {
                        return `
                            <div class="bracket-match" style="opacity: 0.5;">
                                <div class="bracket-match-title">${stageTitle}</div>
                                <div class="bracket-match-status">Очікується</div>
                                <div class="bracket-team"><span class="bracket-team-name">?</span><span class="bracket-team-score">-</span></div>
                                <div class="bracket-team"><span class="bracket-team-name">?</span><span class="bracket-team-score">-</span></div>
                            </div>`;
                    }
                    let scores = ["-", "-"];
                    if (m.score) {
                        scores = m.score.split("-").map(s => s.trim());
                    }
                    let status = m.status === "Match Finished" ? "Завершено" : m.time;
                    return `
                    <div class="bracket-match">
                        <div class="bracket-match-title">${stageTitle}</div>
                        <div class="bracket-match-status">${status}</div>
                        <div class="bracket-team">
                            <span class="bracket-team-name">${getWorldCupTeamName(m.home)}</span>
                            <span class="bracket-team-score">${scores[0]}</span>
                        </div>
                        <div class="bracket-team">
                            <span class="bracket-team-name">${getWorldCupTeamName(m.away)}</span>
                            <span class="bracket-team-score">${scores[1] || scores[0]}</span>
                        </div>
                    </div>`;
                }

                stages.forEach(stage => {
                    const stageMatches = matchesByStage[stage.key];
                    
                    html += `<div class="bracket-column-wrapper">`;
                    html += `<div class="bracket-column">`;
                    
                    if (stage.key === "Фінал") {
                        html += renderMatch(stageMatches[0], stage.title);
                    } else {
                        for (let i = 0; i < stage.count; i += 2) {
                            html += `<div class="bracket-pair">`;
                            html += renderMatch(stageMatches[i], stage.title);
                            html += renderMatch(stageMatches[i + 1], stage.title);
                            html += `</div>`;
                        }
                    }
                    html += `</div></div>`;
                });

                html += '</div></div>';
                standingsHost.innerHTML = html;
            }

            async function fetchWorldCupGroupStandingsRows(groupLetter) {
                const url = `https://worldcupstats.football/groups/${groupLetter.toLowerCase()}/`;
                const res = await fetch(url);
                if (!res.ok) {
                    throw new Error(`HTTP ${res.status}`);
                }

                const html = await res.text();
                const doc = new DOMParser().parseFromString(html, "text/html");

                const table = doc.querySelector("table.standings-table");
                if (!table) {
                    return [];
                }

                const rows = [];
                const trList = table.querySelectorAll("tbody tr");
                trList.forEach(tr => {
                    const cells = tr.querySelectorAll("td");
                    if (!cells || cells.length < 10) {
                        return;
                    }

                    const position = parseNumberCell(cells[0].textContent);
                    const teamName = (cells[1].querySelector("span")?.textContent || cells[1].textContent || "").trim();

                    const played = parseNumberCell(cells[2].textContent);
                    const wins = parseNumberCell(cells[3].textContent);
                    const draws = parseNumberCell(cells[4].textContent);
                    const losses = parseNumberCell(cells[5].textContent);
                    const goalsFor = parseNumberCell(cells[6].textContent);
                    const goalsAgainst = parseNumberCell(cells[7].textContent);
                    const goalDifference = parseNumberCell(cells[8].textContent);
                    const points = parseNumberCell(cells[9].textContent);

                    if (
                        position === null ||
                        !teamName ||
                        [played, wins, draws, losses, goalsFor, goalsAgainst, goalDifference, points].some(v => v === null)
                    ) {
                        return;
                    }

                    rows.push({
                        position,
                        teamName,
                        played,
                        wins,
                        draws,
                        losses,
                        goalsFor,
                        goalsAgainst,
                        goalDifference,
                        points
                    });
                });

                return rows;
            }

            async function renderWorldCup2026GroupsStandings(standingsByGroup) {
                const standingsHost = document.getElementById("standings");
                const letters = getWorldCupGroupLetters();
                standingsHost.innerHTML = "";

                if (standingsByGroup && typeof standingsByGroup === "object") {
                    const thirdPlaceRows = getWorldCupThirdPlaceRows(standingsByGroup);
                    const qualifiedThirdPlaceGroups = getWorldCupQualifiedThirdPlaceGroups(thirdPlaceRows);
                    const sections = [
                        ...letters.map(letter => renderWorldCupGroupStandingsSection(letter, standingsByGroup?.[letter] || [], qualifiedThirdPlaceGroups)),
                        renderWorldCupThirdPlaceRankingSection(standingsByGroup, qualifiedThirdPlaceGroups)
                    ];
                    standingsHost.innerHTML = sections.join("");
                    return;
                }

                const fetchedStandingsByGroup = {};

                for (const letter of letters) {
                    try {
                        fetchedStandingsByGroup[letter] = await fetchWorldCupGroupStandingsRows(letter);
                    } catch (e) {
                        fetchedStandingsByGroup[letter] = [];
                    }
                }

                const thirdPlaceRows = getWorldCupThirdPlaceRows(fetchedStandingsByGroup);
                const qualifiedThirdPlaceGroups = getWorldCupQualifiedThirdPlaceGroups(thirdPlaceRows);
                const sections = [
                    ...letters.map(letter => renderWorldCupGroupStandingsSection(letter, fetchedStandingsByGroup[letter] || [], qualifiedThirdPlaceGroups)),
                    renderWorldCupThirdPlaceRankingSection(fetchedStandingsByGroup, qualifiedThirdPlaceGroups)
                ];

                standingsHost.innerHTML = sections.join("");
            }

            async function load() {
                const content = document.getElementById("content");


                try {
                    const res = await fetch("./matches.json?cache=" + Date.now());

                    if (!res.ok) {
                        throw new Error("HTTP " + res.status);
                    }

                    const data = await res.json();
                    console.log("DATA LOADED:", data);

                    // Commented out the group standings as requested
                    // await renderWorldCup2026GroupsStandings(data["Таблиця ЧС 2026"] || {});
                    
                    await renderWorldCup2026Bracket(data);

                    let html = "";

                    const matches = Object.values(data)
                        .filter(value => Array.isArray(value))
                        .flat()
                        .filter(m => (m?.league || "").startsWith("Чемпіонат світу"))
                        .sort((a, b) => {
                            const aDate = `${a.dateIso || "9999-12-31"}T${a.time || "00:00"}`;
                            const bDate = `${b.dateIso || "9999-12-31"}T${b.time || "00:00"}`;
                            return new Date(aDate) - new Date(bDate);
                        });

                    const dedupeKey = match => [
                        match?.dateIso || "",
                        String(match?.league || ""),
                        normalizeMatchTeamName(match?.home || ""),
                        normalizeMatchTeamName(match?.away || "")
                    ].join("|");

                    const byMatchIdentity = new Map();

                    for (const match of matches) {
                        const key = dedupeKey(match);
                        const existing = byMatchIdentity.get(key);

                        if (!existing) {
                            byMatchIdentity.set(key, match);
                            continue;
                        }

                        const existingHasScore = Boolean(String(existing?.score || "").trim());
                        const incomingHasScore = Boolean(String(match?.score || "").trim());

                        if (incomingHasScore && !existingHasScore) {
                            byMatchIdentity.set(key, match);
                            continue;
                        }

                        const existingScore = String(existing?.score || "").trim();
                        const incomingScore = String(match?.score || "").trim();

                        const existingIsFinished = String(existing?.status || "") === "Match Finished";
                        const incomingIsFinished = String(match?.status || "") === "Match Finished";

                        // Якщо в обох є score і він різний — заміняємо, але не перезаписуємо finished на non-finished.
                        if (incomingHasScore && existingHasScore && incomingScore !== existingScore) {
                            if (existingIsFinished && !incomingIsFinished) {
                                // existing finished — тримаємо його
                                continue;
                            }

                            // або incoming finished, або обидва finished
                            byMatchIdentity.set(key, match);
                        }
                    }

                    const todayIso = getKyivTodayIso();
                    const matchesByDate = {};

                    [...byMatchIdentity.values()].forEach(m => {
                        const dateKey = m.dateIso || m.date || "Інша дата";
                        if (!matchesByDate[dateKey]) {
                            matchesByDate[dateKey] = [];
                        }
                        matchesByDate[dateKey].push(m);
                    });

                    if (!Object.prototype.hasOwnProperty.call(matchesByDate, todayIso)) {
                        matchesByDate[todayIso] = [];
                    }

                    Object.keys(matchesByDate)
                        .sort((a, b) => {
                            if (a === "Інша дата") return 1;
                            if (b === "Інша дата") return -1;
                            return new Date(a) - new Date(b);
                        })
                        .forEach(dateIso => {
                            const dateLabel = dateIso === "Інша дата" ? dateIso : formatDateUk(dateIso);
                            const dayClass = dateIso === todayIso ? "day day--today" : "day";
                            html += `<div class="${dayClass}" data-day="${dateIso}">${dateLabel}</div>`;

                            if (dateIso === todayIso && matchesByDate[dateIso].length === 0) {
                                html += `<div class="empty empty--red">Сьогодні матчів немає</div>`;
                            }

                            matchesByDate[dateIso].forEach(m => {
                                const scoreOrTime = m.score
                                    ? `<span class="score">${m.score}</span>`
                                    : m.time;

                                html += `
                <div class="match">
                    <div class="match__league">${renderLeagueLabel(m?.league || "")}</div>
                    <div class="match__body">
                        <div class="match__teams">
                            <span class="match__teams-main">${m?.home || "?"} – ${m?.away || "?"}</span>
                        </div>
                        <div class="time">${scoreOrTime}</div>
                    </div>
                </div>`;
                            });
                        });

                    content.innerHTML = html;

                    const todayElement = document.querySelector(".day--today");
                    if (todayElement && !hasScrolledToToday) {
                        todayElement.scrollIntoView({ behavior: "smooth", block: "start" });
                        hasScrolledToToday = true;
                    }
                } catch (err) {
                    console.log(err);
                    content.innerHTML =
                        "<div id='error'>❌ JSON error: " + err.message + "</div>";
                }
            }

            load();
        </script>
