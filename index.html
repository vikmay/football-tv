<!DOCTYPE html>
<html lang="uk">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
              content="width=device-width, initial-scale=1">
        <title>Football TV</title>

        <style>
            body {
                margin: 0;
                background: #0f0f0f;
                color: white;
                font-family: Arial;
            }

            .header {
                text-align: center;
                font-size: 50px;
                padding: 30px;
            }

            .day {
                color: #00ff88;
                font-size: 28px;
                margin: 20px;
                text-align: center;
            }

            .day--today {
                color: #ff3b30;
            }

            .match {
                background: #1e1e1e;
                margin: 10px auto;
                padding: 18px 20px 16px;
                max-width: 900px;
                border-radius: 12px;
                display: flex;
                flex-direction: column;
                gap: 10px;
                font-size: 26px;
            }

            .match__league {
                color: #ffcc00;
                font-size: 16px;
                font-weight: bold;
                text-align: center;
                text-transform: uppercase;
                letter-spacing: 0.08em;
            }

            .match__league-stage {
                color: #7dd3fc;
            }

            .match__body {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 16px;
                width: 100%;
            }

            .match__teams {
                flex: 1;
                text-align: left;
                line-height: 1.25;
            }

            .match__teams-main {
                display: block;
            }

            .league {
                color: #aaa;
                font-size: 18px;
            }

            .time {
                color: #00ff88;
                font-weight: bold;
                white-space: nowrap;
            }

            .score {
                color: #ffcc00;
                font-weight: bold;
            }

            #error {
                text-align: center;
                color: red;
                font-size: 22px;
            }

            .empty {
                margin: 10px;
                color: #777;
            }

            .empty--red {
                color: #ff3b30;
                text-align: center;
                font-size: 24px;
                margin: 10px 10px 0;
            }

            .standings {
                max-width: 980px;
                margin: 40px auto 24px;
                padding: 18px 16px 20px;
                background: #161616;
                border-radius: 12px;
                font-family: Arial, sans-serif;
            }

            .standings__title {
                margin: 0 0 14px;
                text-align: center;
                font-size: 28px;
                color: #ffcc00;
            }

            .standings__table-wrap {
                border: 1px solid #2a2a2a;
                border-radius: 12px;
                background: #121212;
                overflow: hidden;
            }

            .standings__table {
                width: 100%;
                border-collapse: collapse;
                font-size: 17px;
                table-layout: fixed;
            }

            .standings__table col.standings__col--rank {
                width: 3%;
            }

            .standings__table col.standings__col--team {
                width: 32%;
            }

            .standings__table col.standings__col--played,
            .standings__table col.standings__col--wins,
            .standings__table col.standings__col--draws,
            .standings__table col.standings__col--losses {
                width: 5%;
            }

            .standings__table col.standings__col--goals {
                width: 18%;
            }

            .standings__table col.standings__col--difference {
                width: 12%;
            }

            .standings__table col.standings__col--points {
                width: 10%;
            }

            .standings__table th {
                padding: 10px 6px;
                border-bottom: 1px solid #2a2a2a;
                text-align: center;
                vertical-align: middle;
                overflow: hidden;
                font-size: 12px;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                color: #d9d9d9;
                background: rgba(255, 255, 255, 0.04);
            }

            .standings__table th:nth-child(2),
            .standings__table td:nth-child(2) {
                text-align: left;
                padding-left: 10px;
                padding-right: 0;
                padding-inline-start: 10px;
                padding-inline-end: 0;
            }

            .standings__table td {
                padding: 10px 6px;
                border-bottom: 1px solid #2a2a2a;
                text-align: center;
                vertical-align: middle;
                overflow: hidden;
                font-size: 19px;
            }

            .standings__table tr:last-child td {
                border-bottom: 0;
            }

            .standings__table tr:hover td {
                background: rgba(255, 255, 255, 0.02);
            }

            .standings__rank-cell {
                color: #a8a8a8;
                font-weight: 700;
            }

            .standings__team-cell {
                text-align: left;
                padding-left: 0;
                padding-right: 0;
                font-weight: 700;
                color: #fff;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: clip;
                line-height: 1.15;
                font-size: 16px;
            }

            .standings__points-cell {
                color: #00ff88;
                font-weight: 900;
                font-size: 20px;
                background: rgba(0, 255, 136, 0.12);
                border-left: 1px solid rgba(0, 255, 136, 0.18);
                border-right: 1px solid rgba(0, 255, 136, 0.18);
            }

            .standings__note {
                margin-top: 10px;
                color: #888;
                font-size: 14px;
                text-align: center;
            }

            @media (max-width: 600px) {
                .header {
                    font-size: 32px;
                    padding: 16px 12px;
                }

                .day {
                    font-size: 20px;
                    margin: 12px 12px;
                }

                .match {
                    font-size: 16px;
                    padding: 14px 12px 12px;
                    margin: 8px 10px;
                    gap: 8px;
                }

                .match__league {
                    font-size: 11px;
                }

                .match__body {
                    gap: 12px;
                }

                .time,
                .score {
                    font-size: 14px;
                }

                #error {
                    font-size: 16px;
                }

                .standings {
                    margin: 20px 2px 12px;
                    padding: 6px 1px 4px;
                }

                .standings__title {
                    font-size: 16px;
                    margin-bottom: 6px;
                }

                .standings__table {
                    font-size: 8px;
                }

                .standings__table th,
                .standings__table td {
                    padding: 3px 1px;
                }

                .standings__table col.standings__col--rank {
                    width: 4%;
                }

                .standings__table col.standings__col--team {
                    width: 58%;
                }

                .standings__table col.standings__col--played,
                .standings__table col.standings__col--wins,
                .standings__table col.standings__col--draws,
                .standings__table col.standings__col--losses {
                    width: 4%;
                }

                .standings__table col.standings__col--goals {
                    width: 9%;
                }

                .standings__table col.standings__col--difference {
                    width: 8%;
                }

                .standings__table col.standings__col--points {
                    width: 6%;
                }

                .standings__team-cell {
                    white-space: nowrap;
                    overflow: hidden;
                    text-overflow: clip;
                    font-size: 8px;
                    line-height: 1;
                    padding-left: 0;
                    padding-right: 0;
                }

                .standings__note {
                    font-size: 10px;
                    line-height: 1.25;
                    margin-top: 6px;
                }
            }

            @media (max-width: 420px) {
                .standings {
                    margin-left: 1px;
                    margin-right: 1px;
                    padding-left: 1px;
                    padding-right: 1px;
                }

                .standings__table {
                    font-size: 7.5px;
                }

                .standings__table th,
                .standings__table td {
                    padding: 2px 1px;
                }

                .standings__table th:nth-child(2),
                .standings__table td:nth-child(2) {
                    padding-left: 8px;
                }

                .standings__table col.standings__col--team {
                    width: 60%;
                }

                .standings__table col.standings__col--goals {
                    width: 9%;
                }

                .standings__table col.standings__col--difference {
                    width: 7%;
                }

                .standings__table col.standings__col--points {
                    width: 6%;
                }

                .standings__team-cell {
                    font-size: 7.5px;
                    padding-left: 0;
                    padding-right: 0;
                }
            }

            @media (max-width: 900px) and (orientation: landscape) {
                .standings {
                    margin: 16px 6px 16px;
                    padding: 10px 8px 12px;
                }

                .standings__title {
                    font-size: 18px;
                    margin-bottom: 8px;
                }

                .standings__table {
                    font-size: 10px;
                }

                .standings__table th,
                .standings__table td {
                    padding: 4px 5px;
                }

                .standings__table col.standings__col--rank {
                    width: 8%;
                }

                .standings__table col.standings__col--team {
                    width: 48%;
                }

                .standings__table col.standings__col--played,
                .standings__table col.standings__col--wins,
                .standings__table col.standings__col--draws,
                .standings__table col.standings__col--losses {
                    width: 4%;
                }

                .standings__table col.standings__col--goals {
                    width: 10%;
                }

                .standings__table col.standings__col--difference {
                    width: 10%;
                }

                .standings__table col.standings__col--points {
                    width: 10%;
                }

                .standings__table th:nth-child(2),
                .standings__table td:nth-child(2) {
                    padding-left: 12px;
                    padding-right: 0;
                    padding-inline-start: 12px;
                    padding-inline-end: 0;
                }

                .standings__team-cell {
                    font-size: 10px;
                    padding-left: 0;
                    padding-right: 0;
                }

                .standings__points-cell {
                    font-size: 12px;
                }

                .standings__note {
                    font-size: 11px;
                    margin-top: 6px;
                }
            }

            @media (max-width: 900px) and (orientation: portrait) {
                .header {
                    font-size: 38px;
                    padding: 18px 14px;
                }

                .day {
                    font-size: 24px;
                    margin: 14px 12px;
                }

                .match {
                    font-size: 18px;
                    padding: 16px 14px 14px;
                    margin: 10px 12px;
                    gap: 9px;
                }

                .match__league {
                    font-size: 12px;
                }

                .match__body {
                    gap: 14px;
                }

                .time,
                .score {
                    font-size: 16px;
                }

                #error {
                    font-size: 16px;
                }

                .standings {
                    margin: 16px 2px 10px;
                    padding: 8px 2px 6px;
                }

                .standings__title {
                    font-size: 16px;
                    margin-bottom: 6px;
                }

                .standings__table-wrap {
                    border-radius: 10px;
                }

                .standings__table {
                    font-size: 6.5px;
                }

                .standings__table th,
                .standings__table td {
                    padding: 2px 1px;
                }

                .standings__table th {
                    font-size: 9px;
                    letter-spacing: 0.04em;
                }

                .standings__table td {
                    font-size: 10px;
                }

                .standings__table col.standings__col--rank {
                    width: 6%;
                }

                .standings__table col.standings__col--team {
                    width: 42%;
                }

                .standings__table col.standings__col--played,
                .standings__table col.standings__col--wins,
                .standings__table col.standings__col--draws,
                .standings__table col.standings__col--losses {
                    width: 5%;
                }

                .standings__table col.standings__col--goals {
                    width: 12%;
                }

                .standings__table col.standings__col--difference {
                    width: 10%;
                }

                .standings__table col.standings__col--points {
                    width: 10%;
                }

                .standings__table th:nth-child(2),
                .standings__table td:nth-child(2) {
                    padding-left: 8px;
                    padding-right: 0;
                    padding-inline-start: 8px;
                    padding-inline-end: 0;
                }

                .standings__team-cell {
                    white-space: nowrap;
                    overflow: hidden;
                    text-overflow: clip;
                    font-size: 7px;
                    line-height: 1;
                    padding-left: 0;
                    padding-right: 0;
                }

                .standings__points-cell {
                    font-size: 11px;
                }

                .standings__note {
                    font-size: 9px;
                    line-height: 1.2;
                    margin-top: 5px;
                }
            }

            .modal-overlay {
                display: none;
                position: fixed; top: 0; left: 0; width: 100%; height: 100%;
                background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 1000;
            }
            .modal-overlay.active { display: flex; }
            .modal {
                background: #161616; padding: 25px; border-radius: 12px; width: 90%; max-width: 500px;
                color: white; display: flex; flex-direction: column; gap: 15px; border: 1px solid #333;
                max-height: 85vh; overflow-y: auto;
            }
            .modal h2 { margin: 0 0 10px; color: #00ff88; text-align: center; font-size: 24px; }
            .modal-row { display: flex; flex-direction: column; gap: 5px; }
            .modal-row label { font-size: 14px; color: #aaa; }
            .modal input, .modal select, .modal button {
                padding: 12px; font-size: 16px; background: #222; border: 1px solid #444; color: white; border-radius: 8px;
            }
            .modal button { cursor: pointer; background: #00ff88; color: #000; font-weight: bold; border: none; margin-top: 10px; }
            .modal button.close-btn { background: #444; color: white; margin-top: 5px; }
            .modal button.delete-btn { background: #ff3b30; color: white; margin-top: 0; padding: 8px 12px; font-size: 14px; }
            .admin-list { margin-top: 20px; border-top: 1px solid #333; padding-top: 15px; display: flex; flex-direction: column; gap: 10px; }
            .admin-item { background: #222; padding: 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
            .admin-item-info { display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
            .admin-item-info .lg { color: #ffcc00; font-size: 12px; font-weight: bold; }
        </style>
    </head>

    <body>

        <div class="header">⚽ Football TV</div>
        <div id="content">Loading...</div>
        <div id="standings"></div>

        <div class="modal-overlay" id="adminModal">
            <div class="modal">
                <h2>Додати подію</h2>
                <div class="modal-row" style="margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 15px;">
                    <label style="color:#ffcc00">GitHub Token (один раз на пристрій)</label>
                    <input type="password" id="adminToken" placeholder="ghp_xxxxxxxxxxxx">
                </div>
                <div class="modal-row">
                    <label>Категорія (Спорт)</label>
                    <select id="adminLeague">
                        <option value="Бокс">Бокс</option>
                        <option value="Футбол (Свій турнір)">Футбол</option>
                    </select>
                </div>
                <div class="modal-row">
                    <label>Команда 1 / Боксер 1</label>
                    <input type="text" id="adminHome" placeholder="Напр. Усик О.">
                </div>
                <div class="modal-row">
                    <label>Команда 2 / Боксер 2</label>
                    <input type="text" id="adminAway" placeholder="Напр. Ф'юрі Т.">
                </div>
                <div class="modal-row">
                    <label>Дата (РРРР-ММ-ДД)</label>
                    <input type="date" id="adminDate">
                </div>
                <div class="modal-row">
                    <label>Час (ГГ:ХХ)</label>
                    <input type="time" id="adminTime" value="00:00">
                </div>
                <input type="hidden" id="adminId">
                <button onclick="saveAdminMatch()" id="adminSaveBtn">Зберегти подiю (GitHub)</button>
                <button class="close-btn" onclick="closeAdminModal()">Закрити</button>

                <div class="admin-list" id="adminList">Loading...</div>
            </div>
        </div>

        <script>
            let hasScrolledToToday = false;
            let headerClickCount = 0;
            let headerClickTimer = null;

            document.querySelector('.header').addEventListener('click', () => {
                headerClickCount++;
                if (headerClickCount === 7) {
                    openAdminModal();
                    headerClickCount = 0;
                }
                clearTimeout(headerClickTimer);
                headerClickTimer = setTimeout(() => { headerClickCount = 0; }, 2000);
            });

            let cachedManualMatches = [];
            let currentFileSha = null;
            const GITHUB_REPO = "vikmay/football-tv";
            const GITHUB_FILE = "manual_matches.json";

            async function getGitHubManualMatches(token) {
                const res = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/${GITHUB_FILE}`, {
                    headers: { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github.v3+json' },
                    cache: 'no-store'
                });
                if (res.status === 404) return { content: [], sha: null };
                if (!res.ok) throw new Error('API Error ' + res.status);
                const data = await res.json();
                const jsonStr = decodeURIComponent(escape(atob(data.content)));
                return { content: JSON.parse(jsonStr || '[]'), sha: data.sha };
            }

            async function updateGitHubManualMatches(token, newContent, sha) {
                const contentEncoded = btoa(unescape(encodeURIComponent(JSON.stringify(newContent, null, 2))));
                const body = {
                    message: "Update manual matches from web UI",
                    content: contentEncoded,
                    branch: "main"
                };
                if (sha) body.sha = sha;

                const res = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/${GITHUB_FILE}`, {
                    method: 'PUT',
                    headers: { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                if (!res.ok) throw new Error('Update failed ' + res.status);
                return await res.json();
            }

            async function openAdminModal() {
                document.getElementById('adminModal').classList.add('active');
                
                const savedToken = localStorage.getItem('github_token') || "";
                document.getElementById('adminToken').value = savedToken;

                document.getElementById('adminId').value = "";
                document.getElementById('adminHome').value = "";
                document.getElementById('adminAway').value = "";
                document.getElementById('adminTime').value = "00:00";
                
                const today = new Date();
                document.getElementById('adminDate').value = today.toISOString().split('T')[0];
                
                document.getElementById('adminList').innerHTML = "Завантаження з GitHub...";
                
                if (savedToken) {
                    try {
                        const file = await getGitHubManualMatches(savedToken);
                        cachedManualMatches = file.content;
                        currentFileSha = file.sha;
                        renderAdminList();
                    } catch (err) {
                        document.getElementById('adminList').innerHTML = `<p style="color:red">Помилка завантаження. Перевірте токен.</p>`;
                    }
                } else {
                    document.getElementById('adminList').innerHTML = `<p style="color:#aaa">Введіть GitHub Token для завантаження подій</p>`;
                }
            }

            function closeAdminModal() {
                document.getElementById('adminModal').classList.remove('active');
            }

            async function saveAdminMatch() {
                const token = document.getElementById('adminToken').value.trim();
                if (!token) { alert('Потрібен GitHub Token!'); return; }
                localStorage.setItem('github_token', token);

                const league = document.getElementById('adminLeague').value;
                const home = document.getElementById('adminHome').value.trim();
                const away = document.getElementById('adminAway').value.trim();
                const dateIso = document.getElementById('adminDate').value;
                const time = document.getElementById('adminTime').value;
                const editId = document.getElementById('adminId').value;

                if (!home || !away || !dateIso) {
                    alert('Заповніть команди та дату!');
                    return;
                }

                const btn = document.getElementById('adminSaveBtn');
                btn.innerText = "Збереження...";
                btn.disabled = true;

                try {
                    // Always fetch latest before saving to avoid sha conflicts
                    const file = await getGitHubManualMatches(token);
                    const matches = file.content;
                    currentFileSha = file.sha;

                    const newMatch = {
                        id: editId || 'manual-' + Date.now(),
                        league, home, away, dateIso, time,
                        status: "Scheduled"
                    };

                    if (editId) {
                        const idx = matches.findIndex(m => m.id === editId);
                        if (idx >= 0) matches[idx] = newMatch;
                    } else {
                        matches.push(newMatch);
                    }

                    await updateGitHubManualMatches(token, matches, currentFileSha);
                    
                    document.getElementById('adminId').value = "";
                    document.getElementById('adminHome').value = "";
                    document.getElementById('adminAway').value = "";
                    
                    cachedManualMatches = matches;
                    renderAdminList();
                    alert("Збережено! Оновіть сторінку через хвилину (доки GitHub Actions згенерує новий розклад).");
                    load();
                } catch(e) {
                    alert("Помилка збереження: " + e.message);
                } finally {
                    btn.innerText = "Зберегти подiю (GitHub)";
                    btn.disabled = false;
                }
            }

            async function deleteAdminMatch(id) {
                if(!confirm('Видалити?')) return;
                const token = document.getElementById('adminToken').value.trim();
                if (!token) return;
                
                try {
                    const file = await getGitHubManualMatches(token);
                    const matches = file.content.filter(m => m.id !== id);
                    await updateGitHubManualMatches(token, matches, file.sha);
                    cachedManualMatches = matches;
                    renderAdminList();
                    load();
                } catch(e) {
                    alert("Помилка видалення: " + e.message);
                }
            }

            function editAdminMatch(id) {
                const m = cachedManualMatches.find(x => x.id === id);
                if(m) {
                    document.getElementById('adminId').value = m.id;
                    document.getElementById('adminLeague').value = m.league || "Бокс";
                    document.getElementById('adminHome').value = m.home || "";
                    document.getElementById('adminAway').value = m.away || "";
                    document.getElementById('adminDate').value = m.dateIso || "";
                    document.getElementById('adminTime').value = m.time || "00:00";
                }
            }

            function renderAdminList() {
                const list = document.getElementById('adminList');
                list.innerHTML = '<h3>Ваші ручні події</h3>';
                if(cachedManualMatches.length === 0) {
                    list.innerHTML += '<p style="color:#aaa;font-size:14px;">Немає подій</p>';
                    return;
                }
                cachedManualMatches.forEach(m => {
                    list.innerHTML += `
                        <div class="admin-item">
                            <div class="admin-item-info">
                                <span class="lg">${m.league}</span>
                                <span>${m.home} - ${m.away}</span>
                                <span style="color:#00ff88">${m.dateIso} ${m.time}</span>
                            </div>
                            <div style="display:flex;gap:5px;flex-direction:column;">
                                <button class="delete-btn" style="background:#555" onclick="editAdminMatch('${m.id}')">Редаг.</button>
                                <button class="delete-btn" onclick="deleteAdminMatch('${m.id}')">Видалити</button>
                            </div>
                        </div>
                    `;
                });
            }

            function renderLeagueLabel(label) {
                return String(label || "").replace(/\s*\(([^)]+)\)/, ' <span class="match__league-stage">($1)</span>');
            }

            function getKyivTodayIso() {
                return new Intl.DateTimeFormat("en-CA", {
                    timeZone: "Europe/Kyiv",
                    year: "numeric",
                    month: "2-digit",
                    day: "2-digit"
                }).format(new Date());
            }

            function formatDateUk(dateIso) {
                const date = new Date(`${dateIso}T12:00:00Z`);
                const todayIso = getKyivTodayIso();
                const weekdays = [
                    "неділя",
                    "понеділок",
                    "вівторок",
                    "середа",
                    "четвер",
                    "пʼятниця",
                    "субота"
                ];
                const dayName = weekdays[date.getUTCDay()];
                const formattedDate = date.toLocaleDateString("uk-UA", {
                    timeZone: "Europe/Kyiv",
                    day: "numeric",
                    month: "long"
                });

                return dateIso === todayIso
                    ? `Сьогодні, ${dayName}, ${formattedDate}`
                    : `${dayName}, ${formattedDate}`;
            }


            function normalizeMatchTeamName(teamName) {
                const cleaned = String(teamName || "")
                    .replace(/^«+/, "")
                    .replace(/»+$/, "")
                    .replace(/^"+/, "")
                    .replace(/"+$/, "")
                    .trim();

                const aliases = {
                    // existing
                    "Ноттінгем": "Ноттінгем Форест",
                    "Nottingham": "Nottingham Forest",

                    // УПЛ: normalize variants for dedupeKey only
                    "Полтава": "СК Полтава",
                    "СК Полтава": "СК Полтава",

                    "Оболонь": "Оболонь Київ",
                    "Оболонь Київ": "Оболонь Київ",

                    "Зоря": "Зоря Луганськ",
                    "Зоря Луганськ": "Зоря Луганськ",

                    "Рух": "Рух Львів",
                    "Рух Львів": "Рух Львів",

                    "Верес": "Верес Рівне",
                    "Верес Рівне": "Верес Рівне",

                    "Полісся Ж.": "Полісся Житомир",
                    "Полісся Житомир": "Полісся Житомир",

                    "Карпати Л.": "Карпати Львів",
                    "Карпати Львів": "Карпати Львів",

                    "Епіцентр Кам'янець-Подільський": "Епіцентр",
                    "Епіцентр": "Епіцентр",

                    "Колос": "Колос Ковалівка",
                    "Колос Ковалівка": "Колос Ковалівка"
                };

                if (cleaned === "Епіцентр Кам'янець-Подільський") {
                    return "Епіцентр";
                }

                const duplicateMatch = cleaned.match(/^(.+?)\s+\1$/i);
                if (duplicateMatch) {
                    return duplicateMatch[1];
                }

                return aliases[cleaned] || cleaned;
            }

            function getStandingsTeamLabel(teamName) {
                return normalizeMatchTeamName(teamName);
            }

            function renderUplStandings(standings) {
                const standingsHost = document.getElementById("standings");
                const rows = Array.isArray(standings) ? standings : [];

                if (!rows.length) {
                    standingsHost.innerHTML = "";
                    return;
                }

                standingsHost.innerHTML = `
                    <section class="standings">
                        <h2 class="standings__title">Таблиця УПЛ</h2>
                        <div class="standings__table-wrap">
                            <table class="standings__table">
                                <colgroup>
                                    <col class="standings__col standings__col--rank">
                                    <col class="standings__col standings__col--team">
                                    <col class="standings__col standings__col--played">
                                    <col class="standings__col standings__col--wins">
                                    <col class="standings__col standings__col--draws">
                                    <col class="standings__col standings__col--losses">
                                    <col class="standings__col standings__col--goals">
                                    <col class="standings__col standings__col--difference">
                                    <col class="standings__col standings__col--points">
                                </colgroup>
                                <thead>
                                    <tr>
                                        <th>№</th>
                                        <th>Команда</th>
                                        <th>М</th>
                                        <th>В</th>
                                        <th>Н</th>
                                        <th>П</th>
                                        <th>Г</th>
                                        <th>Р</th>
                                        <th>О</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${rows.map(team => `
                                        <tr>
                                            <td class="standings__rank-cell">${team.position ?? ""}</td>
                                            <td class="standings__team-cell">${getStandingsTeamLabel(team.team || "")}</td>
                                            <td>${team.played ?? ""}</td>
                                            <td>${team.wins ?? ""}</td>
                                            <td>${team.draws ?? ""}</td>
                                            <td>${team.losses ?? ""}</td>
                                            <td>${team.goalsFor ?? ""}:${team.goalsAgainst ?? ""}</td>
                                            <td>${typeof team.goalDifference === "number" && team.goalDifference > 0 ? `+${team.goalDifference}` : (team.goalDifference ?? "")}</td>
                                            <td class="standings__points-cell">${team.points ?? ""}</td>
                                        </tr>
                                    `).join("")}
                                </tbody>
                            </table>
                        </div>
                    </section>
                `;
            }

            async function load() {
                const content = document.getElementById("content");

                try {
                    const res = await fetch("./matches.json?cache=" + Date.now());

                    if (!res.ok) {
                        throw new Error("HTTP " + res.status);
                    }

                    const data = await res.json();
                    console.log("DATA LOADED:", data);

                    const standings = data["Таблиця УПЛ"] || [];
                    let html = "";

                    let publicManualMatches = [];
                    try {
                        const mRes = await fetch("./manual_matches.json?cache=" + Date.now());
                        if (mRes.ok) {
                            publicManualMatches = await mRes.json();
                        }
                    } catch(e) {}

                    const matches = Object.entries(data)
                        .filter(([key, value]) => key !== "Таблиця УПЛ" && key !== "Українські клуби в Європі" && Array.isArray(value))
                        .flatMap(([, value]) => value)
                        .concat(publicManualMatches)
                        .sort((a, b) => {
                            const aDate = `${a.dateIso || "9999-12-31"}T${a.time || "00:00"}`;
                            const bDate = `${b.dateIso || "9999-12-31"}T${b.time || "00:00"}`;
                            return new Date(aDate) - new Date(bDate);
                        });

                    const dedupeKey = match => [
                        match?.dateIso || "",
                        String(match?.league || ""),
                        normalizeMatchTeamName(match?.home || ""),
                        normalizeMatchTeamName(match?.away || "")
                    ].join("|");

                    const byMatchIdentity = new Map();

                    for (const match of matches) {
                        const key = dedupeKey(match);
                        const existing = byMatchIdentity.get(key);

                        if (!existing) {
                            byMatchIdentity.set(key, match);
                            continue;
                        }

                        const existingHasScore = Boolean(String(existing?.score || "").trim());
                        const incomingHasScore = Boolean(String(match?.score || "").trim());

                        if (incomingHasScore && !existingHasScore) {
                            byMatchIdentity.set(key, match);
                            continue;
                        }

                        const existingScore = String(existing?.score || "").trim();
                        const incomingScore = String(match?.score || "").trim();

                        const existingIsFinished = String(existing?.status || "") === "Match Finished";
                        const incomingIsFinished = String(match?.status || "") === "Match Finished";

                        // Якщо в обох є score і він різний — заміняємо, але не перезаписуємо finished на non-finished.
                        if (incomingHasScore && existingHasScore && incomingScore !== existingScore) {
                            if (existingIsFinished && !incomingIsFinished) {
                                // existing finished — тримаємо його
                                continue;
                            }

                            // або incoming finished, або обидва finished
                            byMatchIdentity.set(key, match);
                        }
                    }

                    const currentTodayIso = getKyivTodayIso();
                    const dateWindowDays = 8;
                    const todayForWindow = new Date(`${currentTodayIso}T12:00:00Z`);
                    const minDate = new Date(todayForWindow);
                    minDate.setUTCDate(minDate.getUTCDate() - dateWindowDays);
                    const maxDate = new Date(todayForWindow);
                    maxDate.setUTCDate(maxDate.getUTCDate() + dateWindowDays);

                    const ukrainianTeams = [
                        "динамо київ", "шахтар донецьк", "кривбас", "полісся житомир", "дніпро-1", "зоря луганськ",
                        "колос ковалівка", "ворскла полтава", "олександрія", "рух львів", "україна", "(ukr)", "(укр)"
                    ];

                    const visibleMatches = [...byMatchIdentity.values()].filter(match => {
                        if (!match?.dateIso) {
                            return true;
                        }

                        const matchDate = new Date(`${match.dateIso}T12:00:00Z`);
                        const inWindow = matchDate >= minDate && matchDate <= maxDate;
                        if (!inWindow) return false;

                        const leagueLower = String(match.league || "").toLowerCase();
                        const isEuropean = leagueLower.includes("ліга чемпіонів") || 
                                           leagueLower.includes("ліга європи") || 
                                           leagueLower.includes("ліга конференцій");
                        
                        if (isEuropean) {
                            const month = matchDate.getUTCMonth(); // 0-11
                            // June, July, August are qualification months for European cups
                            const isQualificationMonth = (month === 5 || month === 6 || month === 7); 
                            const isExplicitQual = leagueLower.includes("квал") || leagueLower.includes("відбір") || leagueLower.includes("qual");

                            if (isQualificationMonth || isExplicitQual) {
                                const homeLower = String(match.home || "").toLowerCase();
                                const awayLower = String(match.away || "").toLowerCase();
                                const isUkr = ukrainianTeams.some(u => 
                                    homeLower.includes(u) || awayLower.includes(u)
                                );
                                if (!isUkr) return false;
                            }
                        }

                        return true;
                    });

                    const todayIso = getKyivTodayIso();
                    const matchesByDate = {};

                    visibleMatches.forEach(m => {
                        const dateKey = m.dateIso || m.date || "Інша дата";
                        if (!matchesByDate[dateKey]) {
                            matchesByDate[dateKey] = [];
                        }
                        matchesByDate[dateKey].push(m);
                    });

                    if (!Object.prototype.hasOwnProperty.call(matchesByDate, todayIso)) {
                        matchesByDate[todayIso] = [];
                    }

                    Object.keys(matchesByDate)
                        .sort((a, b) => {
                            if (a === "Інша дата") return 1;
                            if (b === "Інша дата") return -1;
                            return new Date(a) - new Date(b);
                        })
                        .forEach(dateIso => {
                            const dateLabel = dateIso === "Інша дата" ? dateIso : formatDateUk(dateIso);
                            const dayClass = dateIso === todayIso ? "day day--today" : "day";
                            html += `<div class="${dayClass}" data-day="${dateIso}">${dateLabel}</div>`;

                            if (dateIso === todayIso && matchesByDate[dateIso].length === 0) {
                                html += `<div class="empty empty--red">Сьогодні матчів немає</div>`;
                            }

                            matchesByDate[dateIso].forEach(m => {
                                const scoreOrTime = m.score
                                    ? `<span class="score">${m.score}</span>`
                                    : m.time;

                                html += `
                <div class="match">
                    <div class="match__league">${renderLeagueLabel(m?.league || "")}</div>
                    <div class="match__body">
                        <div class="match__teams">
                            <span class="match__teams-main">${m?.home || "?"} – ${m?.away || "?"}</span>
                        </div>
                        <div class="time">${scoreOrTime}</div>
                    </div>
                </div>`;
                            });
                        });

                    content.innerHTML = html;
                    // renderUplStandings(standings);

                    const todayElement = document.querySelector(".day--today");
                    if (todayElement && !hasScrolledToToday) {
                        todayElement.scrollIntoView({ behavior: "smooth", block: "start" });
                        hasScrolledToToday = true;
                    }
                } catch (err) {
                    console.log(err);
                    content.innerHTML =
                        "<div id='error'>❌ JSON error: " + err.message + "</div>";
                }
            }

            load();
        </script>

    </body>
</html>
